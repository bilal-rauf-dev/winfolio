<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Winfolio OS</title>
  <style>
    :root {
      --taskbar-h: 46px;
      --blue: #0a64ad;
      --blue-dark: #063b78;
      --blue-light: #1b8be9;
      --panel: #f4f7fb;
      --text: #101828;
      --muted: #667085;
      --border: #bfd0e3;
      --shadow: 0 24px 70px rgba(0,0,0,.35);
      --wallpaper-base: linear-gradient(135deg, #071b3a 0%, #083c78 55%, #0a7aa5 100%);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation: none !important;
      transition: none !important;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #071b3a;
      color: white;
      user-select: none;
    }

    button, input, textarea {
      font: inherit;
    }

    a {
      color: var(--blue);
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(70,130,255,.22), transparent 30%),
        radial-gradient(circle at 70% 80%, rgba(0,255,213,.14), transparent 32%),
        #050816;
      transition: opacity .55s ease;
    }

    .boot-card {
      width: min(420px, 88vw);
      padding: 34px;
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      text-align: center;
      backdrop-filter: blur(12px);
    }

    .boot-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(135deg, #46a7ff, #0a64ad);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
      animation: bootPulse 1.6s ease-in-out infinite;
    }

    @keyframes bootPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .progress {
      height: 12px;
      margin-top: 22px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.14);
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #72e6ff, #79ffb7);
      transition: width .18s ease;
    }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 24%, rgba(105,178,255,.38), transparent 25%),
        radial-gradient(circle at 84% 18%, rgba(71,255,199,.18), transparent 24%),
        radial-gradient(circle at 72% 72%, rgba(255,255,255,.10), transparent 34%),
        var(--wallpaper-base);
      transition: background .5s ease;
    }

    .desktop-blob {
      position: absolute;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(50px);
      opacity: .55;
    }

    .blob-a {
      width: 360px;
      height: 360px;
      left: -100px;
      top: -80px;
      background: radial-gradient(circle, rgba(105,178,255,.55), transparent 70%);
      animation: blobFloat 17s ease-in-out infinite;
    }

    .blob-b {
      width: 300px;
      height: 300px;
      right: -70px;
      bottom: 30px;
      background: radial-gradient(circle, rgba(71,255,199,.35), transparent 70%);
      animation: blobFloat 21s ease-in-out infinite reverse;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(28px, -24px) scale(1.08); }
    }

    .desktop::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,.12));
    }

    .desktop-hint {
      position: absolute;
      right: 18px;
      bottom: calc(var(--taskbar-h) + 14px);
      z-index: 1;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.82);
      font-size: 13px;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .desktop-icons {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(2, 92px);
      grid-auto-rows: 106px;
      gap: 10px 12px;
    }

    .desktop-icon {
      width: 92px;
      height: 106px;
      border: 1px solid transparent;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      text-align: center;
      background: transparent;
      animation: iconIn .42s cubic-bezier(.2,.8,.3,1) both;
      transition: background .16s ease, border-color .16s ease, transform .12s ease;
    }

    @keyframes iconIn {
      from { opacity: 0; transform: translateY(16px) scale(.88); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .desktop-icon:hover {
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
    }

    .desktop-icon:active {
      transform: translateY(1px) scale(.97);
    }

    .desktop-icon:focus-visible {
      outline: 2px solid rgba(255,255,255,.65);
      outline-offset: 2px;
    }

    .icon-emoji-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), 0 6px 14px rgba(0,0,0,.28);
      transition: transform .18s ease, background .18s ease;
    }

    .desktop-icon:hover .icon-emoji-wrap {
      background: rgba(255,255,255,.26);
      transform: translateY(-2px);
    }

    .icon-emoji {
      font-size: 26px;
      line-height: 1;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.4));
    }

    .icon-label {
      margin-top: 7px;
      max-width: 90px;
      padding: 3px 6px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .1px;
      overflow-wrap: break-word;
      word-break: keep-all;
      hyphens: none;
      color: #ffffff;
      background: rgba(3, 14, 33, .55);
      backdrop-filter: blur(3px);
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      text-shadow: 0 1px 1px rgba(0,0,0,.6);
    }

    #windowsLayer {
      position: absolute;
      inset: 0 0 var(--taskbar-h) 0;
      z-index: 3;
      pointer-events: none;
    }

    .window {
      position: absolute;
      width: min(720px, calc(100vw - 30px));
      height: 460px;
      min-width: 310px;
      min-height: 230px;
      resize: both;
      overflow: hidden;
      pointer-events: auto;
      border-radius: 12px;
      border: 1px solid #0b3f7a;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      transition: box-shadow .2s ease;
    }

    .window.active {
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
    }

    .window.maximized {
      resize: none;
      border-radius: 0;
    }

    .window.minimized {
      display: none;
    }

    .titlebar {
      height: 36px;
      padding: 0 8px 0 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      cursor: move;
      background: linear-gradient(180deg, var(--blue), var(--blue-dark));
    }

    .window.active .titlebar {
      background: linear-gradient(180deg, var(--blue-light), var(--blue));
    }

    .titlebar-title {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .win-actions {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      width: 30px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      background: rgba(255,255,255,.15);
    }

    .win-btn:hover {
      background: rgba(255,255,255,.28);
    }

    .win-btn.close:hover {
      background: #e81123;
    }

    .window-body {
      height: calc(100% - 36px);
      padding: 18px;
      overflow: auto;
      user-select: text;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-size: 42px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--blue-light));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
    }

    h1, h2, h3, p {
      margin-top: 0;
    }

    h1 { margin-bottom: 6px; }
    h2 { margin-bottom: 12px; }
    h3 { margin-bottom: 8px; }

    .muted {
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      padding: 15px;
      border-radius: 14px;
      background: white;
      border: 1px solid #d7e2ee;
      box-shadow: 0 10px 30px rgba(15,23,42,.06);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      padding: 6px 9px;
      border-radius: 999px;
      background: #eaf4ff;
      color: #07539f;
      border: 1px solid #c9e3ff;
      font-size: 12px;
      font-weight: 700;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: white;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      text-decoration: none;
      background: #07539f;
    }

    .btn.secondary {
      color: var(--blue);
      background: white;
      border-color: #bdd7ef;
    }

    .btn.secondary:hover {
      background: #eff7ff;
    }

    .project-card {
      display: grid;
      gap: 8px;
    }

    .project-card h3 {
      margin-bottom: 0;
    }

    .contact-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contact-form {
      display: grid;
      gap: 10px;
    }

    .input, .textarea {
      width: 100%;
      border: 1px solid #ccd8e5;
      border-radius: 10px;
      padding: 10px 12px;
      background: white;
      color: var(--text);
      outline: none;
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
    }

    .input:focus, .textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(10,100,173,.12);
    }

    .pdf-viewer {
      width: 100%;
      height: 330px;
      border: 1px solid #ccd8e5;
      border-radius: 12px;
      background: white;
    }

    .calculator {
      max-width: 310px;
      margin: 0 auto;
    }

    .calc-display {
      width: 100%;
      height: 58px;
      margin-bottom: 10px;
      padding: 8px 12px;
      border: 1px solid #ccd8e5;
      border-radius: 12px;
      background: #101828;
      color: #eafff4;
      font-size: 26px;
      text-align: right;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-btn {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      background: #e8eef6;
      color: #101828;
      cursor: pointer;
      font-weight: 800;
    }

    .calc-btn:hover {
      background: #dce8f5;
    }

    .calc-btn.op {
      background: #cfe7ff;
      color: #07539f;
    }

    .calc-btn.eq {
      grid-column: span 2;
      background: var(--blue);
      color: white;
    }

    .notes textarea {
      width: 100%;
      height: 260px;
      border-radius: 12px;
      border: 1px solid #ccd8e5;
      padding: 12px;
      resize: none;
      outline: none;
      background:
        linear-gradient(#fff 29px, #eef4fb 30px);
      background-size: 100% 30px;
      line-height: 30px;
      color: var(--text);
    }

    .terminal {
      height: 100%;
      min-height: 270px;
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
      background: #050505;
      color: #a7ff83;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      user-select: text;
    }

    .terminal a {
      color: #79d7ff;
    }

    .terminal-line {
      margin: 0 0 7px;
      white-space: pre-wrap;
    }

    .terminal-input-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .terminal-prompt {
      color: #79d7ff;
      white-space: nowrap;
    }

    .terminal input {
      flex: 1;
      min-width: 120px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #a7ff83;
      font: inherit;
    }

    .ttt {
      max-width: 370px;
      margin: 0 auto;
      text-align: center;
    }

    .ttt-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 14px 0;
    }

    .ttt-cell {
      aspect-ratio: 1 / 1;
      border: 0;
      border-radius: 14px;
      background: #eaf4ff;
      color: #07539f;
      font-size: 38px;
      font-weight: 900;
      cursor: pointer;
    }

    .ttt-cell:hover {
      background: #d7ecff;
    }

    .accent-row, .wallpaper-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .accent-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
      transition: transform .12s ease;
    }

    .accent-swatch.selected {
      border-color: #101828;
      transform: scale(1.1);
    }

    .wallpaper-swatch {
      width: 64px;
      height: 38px;
      border-radius: 9px;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .wallpaper-swatch.selected {
      border-color: var(--blue);
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      margin-top: 6px;
      cursor: pointer;
    }

    .switch-row input {
      width: 38px;
      height: 20px;
      accent-color: var(--blue);
    }

    .widgets-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .widget-card {
      padding: 14px;
      border-radius: 14px;
      background: white;
      border: 1px solid #d7e2ee;
      box-shadow: 0 10px 30px rgba(15,23,42,.06);
    }

    .widget-clock {
      font-size: 26px;
      font-weight: 900;
      margin: 4px 0 0;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
    }

    .signed-in-chip {
      background: #e7f9ee;
      color: #0a7a3d;
      border-color: #bdeccb;
    }

    .taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-h);
      z-index: 4000;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: linear-gradient(180deg, rgba(20,91,172,.94), rgba(8,56,128,.96));
      border-top: 1px solid rgba(255,255,255,.25);
      backdrop-filter: blur(14px);
    }

    .start-btn {
      height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      color: white;
      background: linear-gradient(180deg, #43b66d, #16823d);
      cursor: pointer;
      font-weight: 900;
    }

    .start-btn:hover {
      filter: brightness(1.08);
    }

    .tb-icon-btn {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .tb-icon-btn:hover {
      background: rgba(255,255,255,.24);
    }

    @keyframes taskIn {
      from { opacity: 0; transform: translateY(6px) scale(.9); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .task-buttons {
      flex: 1;
      display: flex;
      gap: 7px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .task-btn {
      max-width: 180px;
      min-width: 120px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.12);
      color: white;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: taskIn .22s ease both;
      transition: background .15s ease;
    }

    .task-btn.active {
      background: rgba(255,255,255,.27);
      border-color: rgba(255,255,255,.38);
    }

    .tray {
      min-width: 86px;
      text-align: right;
      color: white;
      font-size: 13px;
      font-weight: 700;
    }

    .start-menu {
      position: absolute;
      left: 8px;
      bottom: calc(var(--taskbar-h) + 8px);
      width: 320px;
      max-width: calc(100vw - 16px);
      z-index: 5000;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(245,248,252,.94);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 24px 70px rgba(0,0,0,.36);
      backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(14px) scale(.97);
      transform-origin: bottom left;
      transition: opacity .18s ease, transform .2s cubic-bezier(.2,.9,.25,1), visibility 0s linear .2s;
    }

    .start-menu.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
      transition: opacity .18s ease, transform .2s cubic-bezier(.2,.9,.25,1), visibility 0s;
    }

    .menu-search {
      padding: 14px 14px 8px;
    }

    .menu-search input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #ccd8e5;
      outline: none;
      font-size: 13px;
      background: white;
      color: var(--text);
    }

    .menu-search input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(10,100,173,.12);
    }

    .menu-body {
      padding: 2px 14px 6px;
      max-height: min(430px, 56vh);
      overflow-y: auto;
    }

    .menu-section-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 10px 2px 6px;
    }

    .menu-pinned {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .menu-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 4px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
    }

    .menu-tile:hover {
      background: #e8f2ff;
    }

    .menu-tile-icon {
      font-size: 20px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: #eef4fb;
    }

    .menu-tile-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      max-width: 68px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-system {
      display: grid;
      gap: 4px;
      padding-bottom: 4px;
    }

    .menu-item {
      width: 100%;
      min-height: 42px;
      padding: 9px 10px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .menu-item:hover {
      background: #e8f2ff;
    }

    .menu-empty {
      padding: 14px 4px;
      color: var(--muted);
      font-size: 13px;

    const ACCENTS = [
      { name: "ocean", blue: "#0a64ad", dark: "#063b78", light: "#1b8be9" },
      { name: "violet", blue: "#7c3aed", dark: "#4c1d95", light: "#a78bfa" },
      { name: "rose", blue: "#e11d48", dark: "#881337", light: "#fb7185" },
      { name: "emerald", blue: "#059669", dark: "#065f46", light: "#34d399" },
      { name: "amber", blue: "#d97706", dark: "#92400e", light: "#fbbf24" }
    ];

    const WALLPAPERS = [
      { name: "harbor", css: "linear-gradient(135deg, #071b3a 0%, #083c78 55%, #0a7aa5 100%)" },
      { name: "dusk", css: "linear-gradient(135deg, #1c0a3a 0%, #4a1478 55%, #a5327a 100%)" },
      { name: "forest", css: "linear-gradient(135deg, #04231b 0%, #0a5c3f 55%, #17a06f 100%)" },
      { name: "sand", css: "linear-gradient(135deg, #241704 0%, #7a4a0a 55%, #d69328 100%)" }
    ];

    const systemAppIds = ["settings", "widgets", "account"];

    function initials(name) {
      return name.split(" ").map(word => word[0]).slice(0, 2).join("").toUpperCase();
    }

    function setAccent(accent) {
      document.documentElement.style.setProperty("--blue", accent.blue);
      document.documentElement.style.setProperty("--blue-dark", accent.dark);
      document.documentElement.style.setProperty("--blue-light", accent.light);
      localStorage.setItem("winfolio-accent", accent.name);
      document.querySelectorAll(".accent-swatch").forEach(swatch => {
        swatch.classList.toggle("selected", swatch.dataset.name === accent.name);
      });
    }

    function setWallpaper(wallpaper) {
      document.documentElement.style.setProperty("--wallpaper-base", wallpaper.css);
      localStorage.setItem("winfolio-wallpaper", wallpaper.name);
      document.querySelectorAll(".wallpaper-swatch").forEach(swatch => {
        swatch.classList.toggle("selected", swatch.dataset.name === wallpaper.name);
      });
    }

    function setMotion(enabled) {
      document.body.classList.toggle("reduce-motion", !enabled);
      localStorage.setItem("winfolio-motion", enabled ? "on" : "off");
      const toggle = document.getElementById("motionToggle");
      if (toggle) toggle.checked = enabled;
    }

    function mountSettings(win) {
      if (win.dataset.settingsMounted) return;
      win.dataset.settingsMounted = "true";

      const currentAccentName = localStorage.getItem("winfolio-accent") || ACCENTS[0].name;
      const currentWallpaperName = localStorage.getItem("winfolio-wallpaper") || WALLPAPERS[0].name;

      const accentRow = win.querySelector("#accentRow");
      accentRow.innerHTML = ACCENTS.map(accent => `
        <button class="accent-swatch${accent.name === currentAccentName ? " selected" : ""}"
          data-name="${accent.name}" style="background:${accent.blue}" title="${accent.name}"></button>
      `).join("");
      accentRow.querySelectorAll(".accent-swatch").forEach(swatch => {
        swatch.addEventListener("click", () => {
          const accent = ACCENTS.find(a => a.name === swatch.dataset.name);
          if (accent) setAccent(accent);
        });
      });

      const wallpaperRow = win.querySelector("#wallpaperRow");
      wallpaperRow.innerHTML = WALLPAPERS.map(wallpaper => `
        <button class="wallpaper-swatch${wallpaper.name === currentWallpaperName ? " selected" : ""}"
          data-name="${wallpaper.name}" style="background:${wallpaper.css}" title="${wallpaper.name}"></button>
      `).join("");
      wallpaperRow.querySelectorAll(".wallpaper-swatch").forEach(swatch => {
        swatch.addEventListener("click", () => {
          const wallpaper = WALLPAPERS.find(w => w.name === swatch.dataset.name);
          if (wallpaper) setWallpaper(wallpaper);
        });
      });

      const motionToggle = win.querySelector("#motionToggle");
      motionToggle.checked = !document.body.classList.contains("reduce-motion");
      motionToggle.addEventListener("change", () => setMotion(motionToggle.checked));
    }

    function mountWidgets(win) {
      if (win.dataset.widgetsMounted) return;
      win.dataset.widgetsMounted = "true";

      const clockEl = win.querySelector("#widgetClock");
      const dateEl = win.querySelector("#widgetDate");

      const tick = () => {
        if (!win.isConnected) {
          clearInterval(timer);
          return;
        }

        const now = new Date();
        clockEl.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
        dateEl.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
      };

      const timer = setInterval(tick, 1000);
      tick();

      const quotes = [
        "Build something small, ship it, then iterate.",
        "Clean code is a habit, not an event.",
        "Every bug fixed is a lesson learned.",
        "Consistency beats intensity over time.",
        "Good UX is invisible until it's missing.",
        "Done is better than perfect. Then improve."
      ];

      const quoteEl = win.querySelector("#widgetQuote");
      win.querySelector("#widgetQuoteBtn").addEventListener("click", () => {
        quoteEl.textContent = quotes[Math.floor(Math.random() * quotes.length)];
      });

      win.querySelector("#widgetNotesBtn").addEventListener("click", () => {
        openApp("notes", win.querySelector("#widgetNotesBtn"));
      });
    }

    const desktopIcons = document.getElementById("desktopIcons");
    const windowsLayer = document.getElementById("windowsLayer");
    const taskButtons = document.getElementById("taskButtons");
    const startBtn = document.getElementById("startBtn");
    const searchBtn = document.getElementById("searchBtn");
    const widgetsBtn = document.getElementById("widgetsBtn");
    const startMenu = document.getElementById("startMenu");
    const menuSearch = document.getElementById("menuSearch");
    const clock = document.getElementById("clock");

    const openWindows = new Map();
    const taskButtonMap = new Map();

    let zCounter = 20;
    let activeAppId = null;

    function renderDesktopIcons() {
      desktopIcons.innerHTML = desktopAppIds.map((id, index) => {
        const app = APP_DEFS[id];
        return `
          <button class="desktop-icon" data-open="${id}" title="Open ${app.title}" style="animation-delay:${index * 55}ms">
            <span class="icon-emoji-wrap"><span class="icon-emoji">${app.icon}</span></span>
            <span class="icon-label">${app.title}</span>
          </button>
        `;
      }).join("");

      desktopIcons.querySelectorAll("[data-open]").forEach(icon => {
        icon.addEventListener("click", () => {
          if (!document.body.classList.contains("reduce-motion")) {
            icon.animate(
              [
                { transform: "scale(1)" },
                { transform: "scale(.9)" },
                { transform: "scale(1.05)" },
                { transform: "scale(1)" }
              ],
              { duration: 260, easing: "ease-out" }
            );
          }
          openApp(icon.dataset.open, icon);
        });
      });
    }

    function renderStartMenu() {
      document.getElementById("menuName").textContent = PROFILE.name;
      document.getElementById("menuAccountAvatar").textContent = initials(PROFILE.name);

      const menuPinned = document.getElementById("menuPinned");
      menuPinned.innerHTML = desktopAppIds.map(id => {
        const app = APP_DEFS[id];
        return `
          <button class="menu-tile" data-open="${id}" data-name="${app.title.toLowerCase()}">
            <span class="menu-tile-icon">${app.icon}</span>
            <span class="menu-tile-label">${app.title}</span>
          </button>
        `;
      }).join("");

      menuPinned.querySelectorAll("[data-open]").forEach(tile => {
        tile.addEventListener("click", () => {
          openApp(tile.dataset.open, tile);
          startMenu.classList.remove("open");
        });
      });

      const menuSystem = document.getElementById("menuSystem");
      menuSystem.innerHTML = systemAppIds.map(id => {
        const app = APP_DEFS[id];
        return `
          <button class="menu-item" data-open="${id}">
            <span>${app.icon}</span>
            <span>${app.title}</span>
          </button>
        `;
      }).join("");

      menuSystem.querySelectorAll("[data-open]").forEach(item => {
        item.addEventListener("click", () => {
          openApp(item.dataset.open, item);
          startMenu.classList.remove("open");
        });
      });

      menuSearch.addEventListener("input", () => {
        const query = menuSearch.value.trim().toLowerCase();
        let visibleCount = 0;

        menuPinned.querySelectorAll(".menu-tile").forEach(tile => {
          const match = tile.dataset.name.includes(query);
          tile.style.display = match ? "" : "none";
          if (match) visibleCount += 1;
        });

        let empty = menuPinned.parentElement.querySelector(".menu-empty");
        if (query && visibleCount === 0) {
          if (!empty) {
            empty = document.createElement("div");
            empty.className = "menu-empty";
            empty.textContent = "No apps found.";
            menuPinned.insertAdjacentElement("afterend", empty);
          }
        } else if (empty) {
          empty.remove();
        }
      });

      menuSearch.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;
        const visibleTile = Array.from(menuPinned.querySelectorAll(".menu-tile"))
          .find(tile => tile.style.display !== "none");
        if (visibleTile) visibleTile.click();
      });

      document.getElementById("menuAccountBtn").addEventListener("click", () => {
        openApp("account", document.getElementById("menuAccountBtn"));
        startMenu.classList.remove("open");
      });

      document.getElementById("menuPowerBtn").addEventListener("click", () => {
        startMenu.classList.remove("open");
        shutdown();
      });
    }

    function animateWindowOpen(win, triggerEl) {
      if (document.body.classList.contains("reduce-motion")) return;

      const targetRect = win.getBoundingClientRect();
      const originRect = triggerEl
        ? triggerEl.getBoundingClientRect()
        : { left: targetRect.left + targetRect.width / 2 - 10, top: targetRect.top + targetRect.height / 2 - 10, width: 20, height: 20 };

      const dx = (originRect.left + originRect.width / 2) - (targetRect.left + targetRect.width / 2);
      const dy = (originRect.top + originRect.height / 2) - (targetRect.top + targetRect.height / 2);
      const scale = Math.max(0.08, Math.min(originRect.width / targetRect.width, 0.3));

      win.style.transformOrigin = "center center";
      win.style.transition = "none";
      win.style.opacity = "0";
      win.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      win.style.filter = "blur(2px)";

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          win.style.transition = "transform .32s cubic-bezier(.2,.9,.25,1), opacity .24s ease, filter .28s ease";
          win.style.opacity = "1";
          win.style.transform = "translate(0, 0) scale(1)";
          win.style.filter = "none";
        });
      });

      const cleanup = event => {
        if (event.propertyName !== "transform") return;
        win.style.transition = "";
        win.style.transform = "";
        win.style.filter = "";
        win.removeEventListener("transitionend", cleanup);
      };

      win.addEventListener("transitionend", cleanup);
    }

    function animateWindowClose(win, callback) {
      if (document.body.classList.contains("reduce-motion")) {
        callback();
        return;
      }

      win.style.transformOrigin = "center center";
      win.style.transition = "transform .18s ease, opacity .18s ease";
      win.style.transform = "scale(.9)";
      win.style.opacity = "0";
      setTimeout(callback, 180);
    }

    function pulseWindow(win) {
      if (document.body.classList.contains("reduce-motion")) return;
      win.animate(
        [{ transform: "translateY(0)" }, { transform: "translateY(-4px)" }, { transform: "translateY(0)" }],
        { duration: 220, easing: "ease-out" }
      );
    }

    function openApp(appId, triggerEl) {
      const existing = openWindows.get(appId);

      if (existing) {
        const wasMinimized = existing.classList.contains("minimized");
        existing.classList.remove("minimized");
        focusWindow(existing);

        if (wasMinimized) {
          animateWindowOpen(existing, taskButtonMap.get(appId) || triggerEl);
        } else {
          pulseWindow(existing);
        }
        return;
      }

      const app = APP_DEFS[appId];
      const win = document.createElement("section");
      win.className = "window";
      win.dataset.appId = appId;
      win.style.width = app.width || "680px";
      win.style.height = app.height || "440px";

      const offset = openWindows.size % 7;
      win.style.left = `${150 + offset * 34}px`;
      win.style.top = `${58 + offset * 28}px`;

      win.innerHTML = `
        <header class="titlebar">
          <div class="titlebar-title">
            <span>${app.icon}</span>
            <span>${app.title}</span>
          </div>
          <div class="win-actions">
            <button class="win-btn minimize" title="Minimize">—</button>
            <button class="win-btn maximize" title="Maximize">□</button>
            <button class="win-btn close" title="Close">×</button>
          </div>
        </header>
        <div class="window-body">${app.render()}</div>
      `;

      windowsLayer.appendChild(win);
      openWindows.set(appId, win);

      wireWindowControls(win);
      makeDraggable(win, win.querySelector(".titlebar"));
      createTaskButton(appId);
      focusWindow(win);
      animateWindowOpen(win, triggerEl);

      if (app.afterOpen) app.afterOpen(win);
    }

    function wireWindowControls(win) {
      const appId = win.dataset.appId;

      win.addEventListener("pointerdown", () => focusWindow(win));

      win.querySelector(".close").addEventListener("click", event => {
        event.stopPropagation();
        closeWindow(appId);
      });

      win.querySelector(".minimize").addEventListener("click", event => {
        event.stopPropagation();
        minimizeWindow(appId);
      });

      win.querySelector(".maximize").addEventListener("click", event => {
        event.stopPropagation();
        toggleMaximize(win);
      });
    }

    function createTaskButton(appId) {
      const app = APP_DEFS[appId];
      const btn = document.createElement("button");
      btn.className = "task-btn";
      btn.dataset.appId = appId;
      btn.innerHTML = `${app.icon} ${app.title}`;

      btn.addEventListener("click", () => {
        const win = openWindows.get(appId);
        if (!win) return;

        if (win.classList.contains("minimized")) {
          win.classList.remove("minimized");
          focusWindow(win);
          animateWindowOpen(win, btn);
          return;
        }

        if (activeAppId === appId) {
          minimizeWindow(appId);
        } else {
          focusWindow(win);
          pulseWindow(win);
        }
      });

      taskButtons.appendChild(btn);
      taskButtonMap.set(appId, btn);
    }

    function focusWindow(win) {
      const appId = win.dataset.appId;
      activeAppId = appId;
      win.classList.remove("minimized");
      win.style.zIndex = ++zCounter;

      document.querySelectorAll(".window").forEach(w => w.classList.remove("active"));
      win.classList.add("active");

      taskButtonMap.forEach(btn => btn.classList.remove("active"));
      const btn = taskButtonMap.get(appId);
      if (btn) btn.classList.add("active");
    }

    function closeWindow(appId) {
      const win = openWindows.get(appId);
      const btn = taskButtonMap.get(appId);

      if (win) animateWindowClose(win, () => win.remove());
      if (btn) btn.remove();

      openWindows.delete(appId);
      taskButtonMap.delete(appId);

      if (activeAppId === appId) activeAppId = null;
    }

    function minimizeWindow(appId) {
      const win = openWindows.get(appId);
      if (!win) return;

      const btn = taskButtonMap.get(appId);

      win.classList.remove("active");
      if (btn) btn.classList.remove("active");
      if (activeAppId === appId) activeAppId = null;

      if (document.body.classList.contains("reduce-motion")) {
        win.classList.add("minimized");
        return;
      }

      const winRect = win.getBoundingClientRect();
      const btnRect = btn ? btn.getBoundingClientRect() : { left: 20, top: window.innerHeight - 10, width: 20, height: 20 };
      const dx = (btnRect.left + btnRect.width / 2) - (winRect.left + winRect.width / 2);
      const dy = (btnRect.top + btnRect.height / 2) - (winRect.top + winRect.height / 2);

      win.style.transformOrigin = "center center";
      win.style.transition = "transform .26s cubic-bezier(.4,0,.6,1), opacity .22s ease";
      win.style.transform = `translate(${dx}px, ${dy}px) scale(.06)`;
      win.style.opacity = "0";

      setTimeout(() => {
        win.classList.add("minimized");
        win.style.transition = "";
        win.style.transform = "";
        win.style.opacity = "";
      }, 260);
    }

    function toggleMaximize(win) {
      if (win.classList.contains("maximized")) {
        const prev = JSON.parse(win.dataset.prevRect || "{}");
        win.style.left = prev.left || "150px";
        win.style.top = prev.top || "58px";
        win.style.width = prev.width || "680px";
        win.style.height = prev.height || "440px";
        win.classList.remove("maximized");
        return;
      }

      win.dataset.prevRect = JSON.stringify({
        left: win.style.left,
        top: win.style.top,
        width: win.style.width,
        height: win.style.height
      });

      win.style.left = "0";
      win.style.top = "0";
      win.style.width = "100vw";
      win.style.height = "calc(100vh - var(--taskbar-h))";
      win.classList.add("maximized");
      focusWindow(win);
    }

    function makeDraggable(win, handle) {
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let startLeft = 0;
      let startTop = 0;

      handle.addEventListener("pointerdown", event => {
        if (event.target.closest("button")) return;
        if (win.classList.contains("maximized")) return;

        dragging = true;
        focusWindow(win);

        startX = event.clientX;
        startY = event.clientY;
        startLeft = parseFloat(win.style.left) || 0;
        startTop = parseFloat(win.style.top) || 0;

        handle.setPointerCapture(event.pointerId);
      });

      handle.addEventListener("pointermove", event => {
        if (!dragging) return;

        const dx = event.clientX - startX;
        const dy = event.clientY - startY;

        const maxLeft = window.innerWidth - 90;
        const maxTop = window.innerHeight - 80;

        win.style.left = `${clamp(startLeft + dx, -win.offsetWidth + 80, maxLeft)}px`;
        win.style.top = `${clamp(startTop + dy, 0, maxTop)}px`;
      });

      handle.addEventListener("pointerup", () => {
        dragging = false;
      });

      handle.addEventListener("pointercancel", () => {
        dragging = false;
      });
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function mountTerminal(win) {
      if (win.dataset.terminalMounted) return;
      win.dataset.terminalMounted = "true";

      const terminal = win.querySelector(".terminal");
      const output = win.querySelector(".terminal-output");
      const input = win.querySelector(".terminal-input");

      const print = html => {
        output.insertAdjacentHTML("beforeend", `<p class="terminal-line">${html}</p>`);
        terminal.scrollTop = terminal.scrollHeight;
      };

      const commands = {
        help: () => `
Available commands:
help, about, skills, projects, contact, links, clear
        `,
        about: () => PROFILE.summary,
        skills: () => Object.entries(PROFILE.skills)
          .map(([group, items]) => `${group}: ${items.join(", ")}`)
          .join("<br>"),
        projects: () => PROFILE.projects
          .map(project => `• <a href="${project.url}" target="_blank">${project.name}</a>`)
          .join("<br>"),
        contact: () => `
Email: <a href="mailto:${PROFILE.email}">${PROFILE.email}</a><br>
LinkedIn: <a href="${PROFILE.links.linkedin}" target="_blank">${PROFILE.links.linkedin}</a>
        `,
        links: () => `
GitHub: <a href="${PROFILE.links.github}" target="_blank">${PROFILE.links.github}</a><br>
Portfolio: <a href="${PROFILE.links.portfolio}" target="_blank">${PROFILE.links.portfolio}</a>
        `
      };

      input.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;

        const command = input.value.trim().toLowerCase();
        print(`<span class="terminal-prompt">guest@winfolio:~$</span> ${command}`);
        input.value = "";

        if (!command) return;

        if (command === "clear") {
          output.innerHTML = "";
          return;
        }

        if (commands[command]) {
          print(commands[command]());
        } else {
          print(`Command not found: ${command}. Type <strong>help</strong>.`);
        }
      });

      setTimeout(() => input.focus(), 50);
    }

    function mountCalculator(win) {
      if (win.dataset.calcMounted) return;
      win.dataset.calcMounted = "true";

      const display = win.querySelector(".calc-display");
      let expression = "";

      const update = () => {
        display.value = expression || "0";
      };

      win.querySelectorAll("[data-calc]").forEach(btn => {
        btn.addEventListener("click", () => {
          const value = btn.dataset.calc;

          if (value === "C") {
            expression = "";
          } else if (value === "⌫") {
            expression = expression.slice(0, -1);
          } else if (value === "=") {
            try {
              if (!/^[0-9+\-*/().%\s]+$/.test(expression)) {
                throw new Error("Invalid expression");
              }

              const normalized = expression.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
              const result = Function(`"use strict"; return (${normalized})`)();

              expression = Number.isFinite(result)
                ? String(Math.round(result * 100000000) / 100000000)
                : "";
            } catch {
              expression = "Error";
              setTimeout(() => {
                expression = "";
                update();
              }, 900);
            }
          } else {
            if (expression === "Error") expression = "";
            expression += value;
          }

          update();
        });
      });
    }

    function mountNotes(win) {
      if (win.dataset.notesMounted) return;
      win.dataset.notesMounted = "true";

      const textarea = win.querySelector("textarea");
      const key = "winfolio-notes";

      textarea.value =
        localStorage.getItem(key) ||
        "Welcome to Notes. Write ideas, todos, or portfolio copy here.";

      textarea.addEventListener("input", () => {
        localStorage.setItem(key, textarea.value);
      });
    }

    function mountGame(win) {
      if (win.dataset.gameMounted) return;
      win.dataset.gameMounted = "true";

      const status = win.querySelector(".ttt-status");
      const cells = Array.from(win.querySelectorAll(".ttt-cell"));
      const reset = win.querySelector(".ttt-reset");

      let board = Array(9).fill("");
      let locked = false;

      const wins = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      function checkWinner() {
        for (const [a,b,c] of wins) {
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return board[a];
          }
        }

        if (board.every(Boolean)) return "draw";
        return null;
      }

      function render() {
        cells.forEach((cell, index) => {
          cell.textContent = board[index];
        });

        const winner = checkWinner();

        if (winner === "X") {
          status.textContent = "You win!";
          locked = true;
        } else if (winner === "O") {
          status.textContent = "Computer wins.";
          locked = true;
        } else if (winner === "draw") {
          status.textContent = "Draw game.";
          locked = true;
        } else {
          status.textContent = locked ? "Computer thinking..." : "Your turn.";
        }
      }

      function findMove(mark) {
        for (const [a,b,c] of wins) {
          const line = [board[a], board[b], board[c]];
          if (line.filter(v => v === mark).length === 2 && line.includes("")) {
            return [a,b,c][line.indexOf("")];
          }
        }
        return null;
      }

      function botMove() {
        if (checkWinner()) return;

        let move =
          findMove("O") ??
          findMove("X") ??
          (board[4] === "" ? 4 : null);

        if (move === null) {
          const empty = board.map((v, i) => v ? null : i).filter(v => v !== null);
          move = empty[Math.floor(Math.random() * empty.length)];
        }

        board[move] = "O";
        locked = false;
        render();
      }

      cells.forEach(cell => {
        cell.addEventListener("click", () => {
          const index = Number(cell.dataset.cell);
          if (locked || board[index]) return;

          board[index] = "X";
          locked = true;
          render();

          if (!checkWinner()) {
            setTimeout(botMove, 450);
          }
        });
      });

      reset.addEventListener("click", () => {
        board = Array(9).fill("");
        locked = false;
        render();
      });

      render();
    }

    function updateClock() {
      const now = new Date();
      clock.textContent = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    const BOOT_MESSAGES = [
      "Booting your portfolio desktop...",
      "Loading apps...",
      "Preparing windows...",
      "Almost there..."
    ];

    function boot() {
      const bootScreen = document.getElementById("bootScreen");
      const bootBar = document.getElementById("bootBar");
      const bootSubtitle = document.getElementById("bootSubtitle");
      let progress = 0;
      let messageIndex = 0;

      bootScreen.style.display = "grid";
      bootScreen.style.opacity = "1";
      bootBar.style.transition = "width .18s ease";
      bootBar.style.width = "0%";

      const messageTimer = setInterval(() => {
        messageIndex = (messageIndex + 1) % BOOT_MESSAGES.length;
        bootSubtitle.textContent = BOOT_MESSAGES[messageIndex];
      }, 500);

      const timer = setInterval(() => {
        progress += Math.random() * 18 + 7;
        if (progress >= 100) {
          progress = 100;
          clearInterval(timer);
          clearInterval(messageTimer);

          setTimeout(() => {
            bootScreen.style.transition = "opacity .55s ease";
            bootScreen.style.opacity = "0";
            setTimeout(() => {
              bootScreen.style.display = "none";
              bootSubtitle.textContent = BOOT_MESSAGES[0];
            }, 560);
          }, 280);
        }

        bootBar.style.width = `${progress}%`;
      }, 150);
    }

    function shutdown() {
      Array.from(openWindows.keys()).forEach(id => closeWindow(id));

      const bootScreen = document.getElementById("bootScreen");
      const bootBar = document.getElementById("bootBar");
      const bootSubtitle = document.getElementById("bootSubtitle");

      bootSubtitle.textContent = "Shutting down...";
      bootScreen.style.transition = "none";
      bootScreen.style.display = "grid";
      bootScreen.style.opacity = "0";
      bootBar.style.transition = "width .5s ease";
      bootBar.style.width = "0%";

      requestAnimationFrame(() => {
        bootScreen.style.transition = "opacity .4s ease";
        bootScreen.style.opacity = "1";
      });

      setTimeout(() => {
        bootSubtitle.textContent = "Booting your portfolio desktop...";
        boot();
      }, 1300);
    }

    function loadSavedPreferences() {
      const accentName = localStorage.getItem("winfolio-accent");
      const wallpaperName = localStorage.getItem("winfolio-wallpaper");
      const motion = localStorage.getItem("winfolio-motion");

      const accent = ACCENTS.find(a => a.name === accentName) || ACCENTS[0];
      const wallpaper = WALLPAPERS.find(w => w.name === wallpaperName) || WALLPAPERS[0];

      document.documentElement.style.setProperty("--blue", accent.blue);
      document.documentElement.style.setProperty("--blue-dark", accent.dark);
      document.documentElement.style.setProperty("--blue-light", accent.light);
      document.documentElement.style.setProperty("--wallpaper-base", wallpaper.css);

      if (motion === "off") {
        document.body.classList.add("reduce-motion");
      }
    }

    startBtn.addEventListener("click", event => {
      event.stopPropagation();
      const willOpen = !startMenu.classList.contains("open");
      startMenu.classList.toggle("open");
      if (willOpen) setTimeout(() => menuSearch.focus(), 160);
    });

    searchBtn.addEventListener("click", event => {
      event.stopPropagation();
      startMenu.classList.add("open");
      setTimeout(() => menuSearch.focus(), 160);
    });

    widgetsBtn.addEventListener("click", () => {
      openApp("widgets", widgetsBtn);
    });

    document.addEventListener("click", event => {
      if (!startMenu.contains(event.target) && event.target !== startBtn && event.target !== searchBtn) {
        startMenu.classList.remove("open");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        startMenu.classList.remove("open");
      }
    });

    loadSavedPreferences();
    renderDesktopIcons();
    renderStartMenu();
    updateClock();
    setInterval(updateClock, 1000);
    boot();
  </script>
</body>
</html>
