<!doctype html>
<html lang="en" data-theme="dark" data-taskbar="center">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Bilal Rauf — full-stack developer and Blue Team security practitioner. An interactive desktop portfolio." />
  <meta name="theme-color" content="#0a0d13" />
  <title>Bilal Rauf — Axiom OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   AXIOM OS — portfolio desktop environment
   ============================================================ */

/* ---------- tokens ---------- */
:root {
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r1: 4px;
  --r2: 6px;
  --r3: 8px;
  --r4: 11px;

  --tb: 52px;

  --accent: #5b7cfa;
  --accent-ink: #ffffff;
  --ok: #22c7a0;
  --warn: #f2a93b;
  --bad: #f1616f;

  --wall-a: #060a12;
  --wall-b: #0d1c33;
  --wall-c: #11384f;

  --ease: cubic-bezier(.2, .85, .25, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in: cubic-bezier(.5, 0, .75, 0);
}

:root,
[data-theme="dark"] {
  --bg0: #0a0d13;
  --bg1: #10141c;
  --bg2: #161b26;
  --bg3: #1e2531;
  --bg4: #262e3d;
  --line: #232b39;
  --line2: #333d4f;
  --tx0: #e9edf5;
  --tx1: #a3adbf;
  --tx2: #6b7688;
  --chrome: rgba(11, 14, 20, .74);
  --chrome-line: rgba(255, 255, 255, .08);
  --sheen: rgba(255, 255, 255, .04);
  --shadow: 0 1px 1px rgba(0, 0, 0, .5), 0 18px 44px -12px rgba(0, 0, 0, .72);
  --shadow-lg: 0 1px 1px rgba(0, 0, 0, .5), 0 34px 80px -18px rgba(0, 0, 0, .8);
}

[data-theme="light"] {
  --bg0: #e9edf3;
  --bg1: #ffffff;
  --bg2: #f5f7fb;
  --bg3: #ecf0f6;
  --bg4: #e0e6ef;
  --line: #e0e6ef;
  --line2: #c8d1de;
  --tx0: #101822;
  --tx1: #4d5868;
  --tx2: #7c8798;
  --chrome: rgba(245, 247, 251, .8);
  --chrome-line: rgba(16, 24, 34, .1);
  --sheen: rgba(16, 24, 34, .03);
  --shadow: 0 1px 1px rgba(16, 24, 34, .1), 0 18px 44px -14px rgba(16, 24, 34, .3);
  --shadow-lg: 0 1px 1px rgba(16, 24, 34, .1), 0 34px 80px -20px rgba(16, 24, 34, .38);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  background: #05070c;
  color: var(--tx0);
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}

button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; margin: 0; letter-spacing: -.015em; }
p { margin: 0; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line2); border: 3px solid transparent; background-clip: padding-box; border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--tx2); background-clip: padding-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

body.no-motion *,
body.no-motion *::before,
body.no-motion *::after {
  animation-duration: .001ms !important;
  animation-delay: 0ms !important;
  transition-duration: .001ms !important;
}

/* ---------- wallpaper ---------- */
.wall {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(1100px 720px at 80% 6%, color-mix(in srgb, var(--wall-c) 62%, transparent), transparent 68%),
    radial-gradient(900px 640px at 6% 96%, color-mix(in srgb, var(--wall-b) 70%, transparent), transparent 70%),
    linear-gradient(158deg, var(--wall-a) 0%, var(--wall-b) 52%, var(--wall-c) 100%);
  transition: background .6s var(--ease);
}

.wall::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, .055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .055) 1px, transparent 1px);
  background-size: 34px 34px;
  -webkit-mask-image: radial-gradient(120% 90% at 72% 8%, #000 0%, transparent 68%);
  mask-image: radial-gradient(120% 90% at 72% 8%, #000 0%, transparent 68%);
}

.wall::after {
  content: "";
  position: absolute;
  inset: -20%;
  background: repeating-linear-gradient(115deg,
      transparent 0 62px,
      rgba(255, 255, 255, .045) 62px 63px);
  -webkit-mask-image: radial-gradient(80% 70% at 18% 88%, #000, transparent 72%);
  mask-image: radial-gradient(80% 70% at 18% 88%, #000, transparent 72%);
}

/* ============================================================
   LOCK · LOGIN · BOOT
   ============================================================ */
.stage {
  position: fixed;
  inset: 0;
  z-index: 9000;
  overflow: hidden;
}

.stage .wall { transform: scale(1.06); filter: saturate(1.05); }

.lock-inner {
  position: relative;
  height: 100%;
  display: grid;
  grid-template-rows: 1fr auto 1fr;
  align-items: center;
  padding: 40px;
  color: #fff;
}

/* lock face */
.lock-face {
  grid-row: 2;
  text-align: center;
  opacity: 0;
  transform: translateY(22px);
  transition: opacity .45s var(--ease), transform .8s var(--ease-out);
}

.stage.lit .lock-face { opacity: 1; transform: none; }

.lock-time {
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-weight: 200;
  font-size: clamp(56px, 12vw, 128px);
  line-height: 1;
  letter-spacing: -.05em;
  text-shadow: 0 8px 40px rgba(0, 0, 0, .5);
}

.lock-time b { font-weight: 200; opacity: .38; }

.lock-date {
  margin-top: 12px;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .68);
}

.lock-hint {
  grid-row: 3;
  align-self: end;
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .55);
  opacity: 0;
  transition: opacity .45s var(--ease) .15s, transform .5s var(--ease);
}

.stage.lit .lock-hint { opacity: 1; }

.lh-pulse {
  display: flex;
  align-items: center;
  gap: 9px;
  animation: breathe 3s ease-in-out infinite;
}

.lock-hint i { display: block; width: 26px; height: 1px; background: rgba(255, 255, 255, .4); }

.lock-brand {
  grid-row: 1;
  align-self: start;
  justify-self: start;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .5);
}

@keyframes breathe { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }


/* login card */
.login-face {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .34s var(--ease);
}

.stage.signing .lock-face,
.stage.signing .lock-hint {
  opacity: 0;
  transform: translateY(-26px);
  pointer-events: none;
  transition: opacity .34s var(--ease), transform .5s var(--ease);
}
.stage.signing .login-face { opacity: 1; pointer-events: auto; }
.stage.signing .wall { transform: scale(1.12); filter: blur(14px) saturate(1.1) brightness(.72); transition: transform 1.4s var(--ease-out), filter .7s var(--ease); }

.login-card {
  width: min(340px, 88vw);
  text-align: center;
  transform: translateY(18px) scale(.96);
  opacity: 0;
  transition: transform .5s var(--ease-out) .08s, opacity .4s var(--ease) .08s;
}

.stage.signing .login-card { transform: none; opacity: 1; }

.login-avatar {
  width: 84px;
  height: 84px;
  margin: 0 auto 18px;
  border-radius: var(--r4);
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--accent-ink);
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
  box-shadow: 0 12px 34px -8px color-mix(in srgb, var(--accent) 60%, transparent), inset 0 1px 0 rgba(255, 255, 255, .28);
}

.login-name { font-size: 21px; color: #fff; }
.login-role { margin-top: 3px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }

.login-field {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 4px 4px 14px;
  border-radius: var(--r2);
  border: 1px solid rgba(255, 255, 255, .18);
  background: rgba(255, 255, 255, .08);
  backdrop-filter: blur(18px);
  transition: border-color .2s, background .2s;
}

.login-field:focus-within { border-color: rgba(255, 255, 255, .42); background: rgba(255, 255, 255, .13); }

.login-field input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: #fff;
  font-size: 14px;
  letter-spacing: .12em;
  padding: 8px 0;
}

.login-field input::placeholder { color: rgba(255, 255, 255, .45); letter-spacing: .02em; }

.login-go {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r1);
  cursor: pointer;
  color: var(--accent-ink);
  background: var(--accent);
  transition: transform .16s var(--ease), filter .16s;
}

.login-go svg { width: 17px; height: 17px; }
.login-go:hover { filter: brightness(1.12); }
.login-go:active { transform: scale(.93); }

.login-alt {
  margin-top: 16px;
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 12px;
  letter-spacing: .06em;
  color: rgba(255, 255, 255, .55);
  border-bottom: 1px solid rgba(255, 255, 255, .22);
  padding: 2px 0;
  transition: color .18s, border-color .18s;
}

.login-alt:hover { color: #fff; border-color: rgba(255, 255, 255, .6); }

/* boot */
.boot-face {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  background: #05070c;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s var(--ease);
}

.stage.booting .boot-face { opacity: 1; }

.boot-inner { text-align: center; width: min(260px, 80vw); }

.boot-mark svg { width: 100%; height: 100%; }

.boot-mark {
  width: 52px;
  height: 52px;
  margin: 0 auto 26px;
  color: var(--accent);
  animation: spinMark 2.4s linear infinite;
}

@keyframes spinMark { to { transform: rotate(360deg) } }

.boot-bar {
  height: 2px;
  border-radius: 2px;
  overflow: hidden;
  background: rgba(255, 255, 255, .12);
}

.boot-bar span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  box-shadow: 0 0 14px var(--accent);
  transition: width .25s var(--ease);
}

.boot-status {
  margin-top: 16px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--tx2);
}

.stage.done { opacity: 0; transform: scale(1.03); pointer-events: none; transition: opacity .5s var(--ease), transform .7s var(--ease-out); }

/* ============================================================
   DESKTOP
   ============================================================ */
.desktop {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.desk-icons {
  position: absolute;
  inset: 14px 14px calc(var(--tb) + 14px) 14px;
  z-index: 2;
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(auto-fill, 92px);
  grid-auto-columns: 84px;
  gap: 2px;
  align-content: start;
  justify-content: start;
  overflow: hidden;
}

.dicon {
  width: 84px;
  height: 92px;
  padding: 9px 4px 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 1px solid transparent;
  border-radius: var(--r2);
  background: transparent;
  color: #fff;
  cursor: pointer;
  opacity: 0;
  transition: background .16s var(--ease), border-color .16s, transform .14s var(--ease);
}

.desktop.ready .dicon { animation: iconIn .5s var(--ease-out) both; }

@keyframes iconIn {
  from { opacity: 0; transform: translateY(12px) scale(.9) }
  to { opacity: 1; transform: none }
}

.dicon:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .14); }
.dicon:active { transform: scale(.95); }
.dicon.sel { background: color-mix(in srgb, var(--accent) 28%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }

.dicon-glyph {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: var(--r2);
  background: rgba(255, 255, 255, .1);
  border: 1px solid rgba(255, 255, 255, .14);
  color: #fff;
  transition: transform .2s var(--ease), background .2s, border-color .2s;
}

.dicon-glyph svg { width: 21px; height: 21px; }
.dicon:hover .dicon-glyph { transform: translateY(-3px); background: color-mix(in srgb, var(--accent) 62%, transparent); border-color: color-mix(in srgb, var(--accent) 85%, transparent); }

.dicon-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .01em;
  line-height: 1.25;
  text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* keyboard hint chip */
.kbd-hint {
  position: absolute;
  right: 18px;
  bottom: calc(var(--tb) + 16px);
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 13px;
  border-radius: var(--r2);
  font-size: 12px;
  color: rgba(255, 255, 255, .78);
  background: rgba(10, 13, 19, .5);
  border: 1px solid rgba(255, 255, 255, .12);
  backdrop-filter: blur(16px);
  pointer-events: none;
  animation: hintIn .6s var(--ease-out) 1.4s both, hintOut .5s var(--ease) 9s both;
}

@keyframes hintIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes hintOut { to { opacity: 0; transform: translateY(8px) } }

kbd {
  font-family: var(--f-mono);
  font-size: 10.5px;
  padding: 3px 6px;
  border-radius: var(--r1);
  background: rgba(255, 255, 255, .13);
  border: 1px solid rgba(255, 255, 255, .16);
  border-bottom-width: 2px;
}

/* ============================================================
   TASKBAR
   ============================================================ */
.taskbar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--tb);
  z-index: 400;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  background: var(--chrome);
  border-top: 1px solid var(--chrome-line);
  backdrop-filter: blur(28px) saturate(1.4);
  transform: translateY(100%);
  transition: transform .55s var(--ease-out);
}

.desktop.ready .taskbar { transform: none; }

.tb-left { display: flex; align-items: center; gap: 4px; }
.tb-mid { display: flex; align-items: center; gap: 3px; justify-self: center; }
.tb-right { display: flex; align-items: center; gap: 4px; justify-self: end; }

[data-taskbar="left"] .taskbar { grid-template-columns: auto 1fr auto; }
[data-taskbar="left"] .tb-mid { justify-self: start; }

.tb-btn {
  position: relative;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx1);
  cursor: pointer;
  transition: background .16s, color .16s, transform .14s var(--ease);
}

.tb-btn svg { width: 19px; height: 19px; }
.tb-btn:hover { background: var(--sheen); color: var(--tx0); }
.tb-btn:active { transform: scale(.9); }
.tb-btn.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

.tb-btn.start { color: var(--tx0); }
.tb-btn.start.on { background: color-mix(in srgb, var(--accent) 18%, transparent); }

#tbApps { max-width: 46vw; overflow: hidden; }

.tb-sep { width: 1px; height: 22px; background: var(--chrome-line); margin: 0 5px; }

/* open-app buttons */
.tb-app {
  position: relative;
  height: 40px;
  min-width: 40px;
  padding: 0 11px;
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 168px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx1);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  transition: background .16s, color .16s;
  animation: tbIn .3s var(--ease-out) both;
}

@keyframes tbIn { from { opacity: 0; transform: translateY(8px) scale(.9) } to { opacity: 1; transform: none } }

.tb-app svg { width: 17px; height: 17px; flex: 0 0 auto; }
.tb-app span { overflow: hidden; text-overflow: ellipsis; }
.tb-app:hover { background: var(--sheen); color: var(--tx0); }

.tb-app::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 2px;
  width: 5px;
  height: 2.5px;
  border-radius: 2px;
  background: var(--tx2);
  transform: translateX(-50%);
  transition: width .26s var(--ease), background .2s;
}

.tb-app.live { background: var(--sheen); color: var(--tx0); }
.tb-app.live::after { width: 17px; background: var(--accent); }

/* tray */
.tray {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px 0 10px;
  height: 40px;
  border-radius: var(--r2);
  cursor: pointer;
  color: var(--tx1);
  transition: background .16s;
}

.tray:hover { background: var(--sheen); }
.tray-icons { display: flex; gap: 9px; }
.tray-icons svg { width: 15px; height: 15px; }

.tray-clock {
  text-align: right;
  line-height: 1.15;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
}

.tray-clock b { display: block; font-size: 12.5px; font-weight: 500; color: var(--tx0); }
.tray-clock small { font-size: 10.5px; color: var(--tx2); }

/* ============================================================
   PANELS (start menu / widgets / palette)
   ============================================================ */
.panel {
  position: absolute;
  z-index: 500;
  background: var(--chrome);
  border: 1px solid var(--chrome-line);
  border-radius: var(--r4);
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(34px) saturate(1.5);
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px) scale(.985);
  transition: opacity .22s var(--ease), transform .3s var(--ease-out), visibility .3s;
}

.panel.open { opacity: 1; visibility: visible; transform: none; }

/* start menu */
#startMenu {
  left: 50%;
  bottom: calc(var(--tb) + 9px);
  width: min(560px, calc(100vw - 24px));
  margin-left: max(-280px, calc(-50vw + 12px));
  padding: 16px;
  transform-origin: bottom center;
}

[data-taskbar="left"] #startMenu { left: 10px; margin-left: 0; }

.sm-search {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 13px;
  height: 40px;
  border-radius: var(--r2);
  border: 1px solid var(--line);
  background: var(--bg1);
}

.sm-search svg { width: 16px; height: 16px; color: var(--tx2); flex: 0 0 auto; }
.sm-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13.5px; }
.sm-search input::placeholder { color: var(--tx2); }

.sm-label {
  margin: 18px 0 9px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--tx2);
}

.sm-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
}

.sm-tile {
  padding: 12px 4px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx1);
  cursor: pointer;
  transition: background .15s, color .15s, transform .14s var(--ease);
}

.sm-tile svg { width: 21px; height: 21px; }
.sm-tile b { font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.2; color: var(--tx0); }
.sm-tile:hover { background: var(--sheen); color: var(--accent); }
.sm-tile:active { transform: scale(.94); }

.sm-empty { padding: 22px 4px; text-align: center; font-size: 12.5px; color: var(--tx2); }

.sm-foot {
  margin-top: 16px;
  padding-top: 13px;
  border-top: 1px solid var(--chrome-line);
  display: flex;
  align-items: center;
  gap: 10px;
}

.sm-user {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 7px 9px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  cursor: pointer;
  text-align: left;
  color: var(--tx0);
  transition: background .15s;
}

.sm-user:hover { background: var(--sheen); }

.sm-ava {
  width: 34px;
  height: 34px;
  border-radius: var(--r2);
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-ink);
  background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 52%, #000));
}

.sm-user b { display: block; font-size: 13px; }
.sm-user small { font-size: 11px; color: var(--tx2); }

.sm-power {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx1);
  cursor: pointer;
  transition: background .15s, color .15s;
}

.sm-power svg { width: 18px; height: 18px; }
.sm-power:hover { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

/* power popover */
#powerMenu {
  right: 12px;
  bottom: calc(var(--tb) + 9px);
  width: 210px;
  padding: 6px;
  transform-origin: bottom right;
}

.pw-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx0);
  cursor: pointer;
  font-size: 13px;
  text-align: left;
  transition: background .15s, color .15s;
}

.pw-item svg { width: 17px; height: 17px; color: var(--tx2); }
.pw-item:hover { background: var(--sheen); }
.pw-item:hover svg { color: var(--accent); }

/* widgets flyout */
#widgetPanel.right {
  left: auto;
  right: 12px;
  transform-origin: bottom right;
}

#widgetPanel {
  left: 12px;
  bottom: calc(var(--tb) + 9px);
  width: min(340px, calc(100vw - 24px));
  padding: 14px;
  transform-origin: bottom left;
  max-height: min(560px, calc(100vh - var(--tb) - 30px));
  overflow: auto;
}

.wg {
  padding: 14px;
  border-radius: var(--r3);
  border: 1px solid var(--line);
  background: var(--bg1);
}

.wg + .wg { margin-top: 9px; }

.wg-h {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--tx2);
  margin-bottom: 11px;
}

.wg-h svg { width: 14px; height: 14px; }

.wg-clock { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 300; letter-spacing: -.03em; line-height: 1; }
.wg-sub { margin-top: 6px; font-size: 12px; color: var(--tx1); }

.wg-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.wg-stat { padding: 11px 10px; border-radius: var(--r2); background: var(--bg2); border: 1px solid var(--line); }
.wg-stat b { display: block; font-family: var(--f-mono); font-size: 19px; font-weight: 500; letter-spacing: -.02em; color: var(--accent); }
.wg-stat small { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--tx2); }

.wg-quote { font-family: var(--f-display); font-size: 14.5px; line-height: 1.55; color: var(--tx0); }

/* ============================================================
   COMMAND PALETTE — signature element
   ============================================================ */
#palette {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: grid;
  justify-items: center;
  align-content: start;
  padding-top: min(16vh, 130px);
  background: rgba(5, 7, 12, .5);
  backdrop-filter: blur(3px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s var(--ease), visibility .2s;
}

#palette.open { opacity: 1; visibility: visible; }

.pal-box {
  width: min(600px, calc(100vw - 28px));
  border-radius: var(--r4);
  border: 1px solid var(--chrome-line);
  background: var(--chrome);
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(40px) saturate(1.6);
  overflow: hidden;
  transform: translateY(-16px) scale(.97);
  opacity: 0;
  transition: transform .32s var(--ease-out), opacity .22s var(--ease);
}

#palette.open .pal-box { transform: none; opacity: 1; }

.pal-top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  height: 56px;
  border-bottom: 1px solid var(--chrome-line);
}

.pal-top svg { width: 18px; height: 18px; color: var(--accent); flex: 0 0 auto; }
.pal-top input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 15.5px; }
.pal-top input::placeholder { color: var(--tx2); }

.pal-list { max-height: min(370px, 48vh); overflow: auto; padding: 7px; }

.pal-group {
  padding: 12px 10px 6px;
  font-family: var(--f-mono);
  font-size: 9.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--tx2);
}

.pal-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 11px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx0);
  cursor: pointer;
  text-align: left;
  font-size: 13.5px;
  scroll-margin: 12px;
}

.pal-item svg { width: 17px; height: 17px; color: var(--tx2); flex: 0 0 auto; }
.pal-item small { margin-left: auto; font-family: var(--f-mono); font-size: 10px; color: var(--tx2); letter-spacing: .05em; }
.pal-item.cur { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.pal-item.cur svg { color: var(--accent); }

.pal-foot {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 9px 16px;
  border-top: 1px solid var(--chrome-line);
  font-size: 11px;
  color: var(--tx2);
}

.pal-foot span { display: flex; align-items: center; gap: 6px; }
.pal-foot kbd { background: var(--sheen); border-color: var(--chrome-line); }

/* ============================================================
   TASK VIEW
   ============================================================ */
#taskView {
  position: fixed;
  inset: 0;
  z-index: 800;
  padding: 60px 48px calc(var(--tb) + 40px);
  background: rgba(5, 7, 12, .62);
  backdrop-filter: blur(22px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .26s var(--ease), visibility .26s;
  overflow: auto;
}

#taskView.open { opacity: 1; visibility: visible; }

.tv-title {
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .5);
  margin-bottom: 22px;
}

.tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }

.tv-card {
  border-radius: var(--r3);
  border: 1px solid rgba(255, 255, 255, .12);
  background: var(--bg1);
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  padding: 0;
  color: var(--tx0);
  transform: translateY(16px);
  opacity: 0;
  animation: tvIn .42s var(--ease-out) forwards;
  transition: transform .2s var(--ease), border-color .2s, box-shadow .2s;
}

@keyframes tvIn { to { transform: none; opacity: 1 } }

.tv-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 18px 40px -14px rgba(0, 0, 0, .7); }

.tv-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 600;
}

.tv-head svg { width: 15px; height: 15px; color: var(--accent); }
.tv-body { height: 120px; padding: 13px; font-size: 11px; color: var(--tx2); overflow: hidden; background: var(--bg2); }
.tv-empty { color: rgba(255, 255, 255, .55); font-size: 14px; }

/* ============================================================
   WINDOWS
   ============================================================ */
#winLayer { position: absolute; inset: 0 0 var(--tb) 0; z-index: 100; pointer-events: none; }

.win {
  position: absolute;
  display: flex;
  flex-direction: column;
  min-width: 300px;
  min-height: 200px;
  pointer-events: auto;
  border-radius: var(--r4);
  border: 1px solid var(--line2);
  background: var(--bg1);
  color: var(--tx0);
  box-shadow: var(--shadow);
  overflow: hidden;
  will-change: transform;
}

.win.active { border-color: color-mix(in srgb, var(--accent) 46%, var(--line2)); box-shadow: var(--shadow-lg); }
.win.max { border-radius: 0; border-color: transparent; }
.win.min { display: none; }
.win.dragging { transition: none !important; }
.win.snapping { transition: left .22s var(--ease), top .22s var(--ease), width .22s var(--ease), height .22s var(--ease); }

.titlebar {
  flex: 0 0 auto;
  height: 40px;
  display: flex;
  align-items: center;
  padding-left: 13px;
  gap: 10px;
  cursor: default;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
}

.tt-icon { display: grid; place-items: center; color: var(--tx2); }
.tt-icon svg { width: 16px; height: 16px; }
.win.active .tt-icon { color: var(--accent); }

.tt-name {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .005em;
  color: var(--tx1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.win.active .tt-name { color: var(--tx0); }

.tt-ctrl { display: flex; flex: 0 0 auto; align-self: stretch; }

.wbtn {
  width: 44px;
  align-self: stretch;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  color: var(--tx1);
  cursor: pointer;
  transition: background .13s, color .13s;
}

.wbtn svg { width: 15px; height: 15px; }
.wbtn:hover { background: var(--bg4); color: var(--tx0); }
.wbtn.x:hover { background: #e5484d; color: #fff; }

.wbody {
  flex: 1;
  min-height: 0;
  overflow: auto;
  user-select: text;
  overscroll-behavior: contain;
}

.wpad { padding: 24px 26px 28px; }

/* resize handles */
.rz { position: absolute; z-index: 4; }
.rz.n { top: -3px; left: 12px; right: 12px; height: 7px; cursor: ns-resize; }
.rz.s { bottom: -3px; left: 12px; right: 12px; height: 7px; cursor: ns-resize; }
.rz.w { left: -3px; top: 12px; bottom: 12px; width: 7px; cursor: ew-resize; }
.rz.e { right: -3px; top: 12px; bottom: 12px; width: 7px; cursor: ew-resize; }
.rz.nw { top: -3px; left: -3px; width: 16px; height: 16px; cursor: nwse-resize; }
.rz.ne { top: -3px; right: -3px; width: 16px; height: 16px; cursor: nesw-resize; }
.rz.sw { bottom: -3px; left: -3px; width: 16px; height: 16px; cursor: nesw-resize; }
.rz.se { bottom: -3px; right: -3px; width: 16px; height: 16px; cursor: nwse-resize; }
.win.max .rz { display: none; }

/* snap preview */
#snapGhost {
  position: absolute;
  z-index: 90;
  border-radius: var(--r4);
  border: 1.5px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 20%, transparent);
  backdrop-filter: blur(6px);
  pointer-events: none;
  opacity: 0;
  transition: opacity .16s var(--ease), left .18s var(--ease), top .18s var(--ease), width .18s var(--ease), height .18s var(--ease);
}

#snapGhost.on { opacity: 1; }

/* context menu */
#ctxMenu {
  position: fixed;
  z-index: 950;
  width: 208px;
  padding: 5px;
  border-radius: var(--r3);
  border: 1px solid var(--chrome-line);
  background: var(--chrome);
  backdrop-filter: blur(30px) saturate(1.5);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  visibility: hidden;
  transform: scale(.95);
  transform-origin: top left;
  transition: opacity .14s var(--ease), transform .18s var(--ease-out), visibility .18s;
}

#ctxMenu.open { opacity: 1; visibility: visible; transform: none; }

.ctx-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border: 0;
  border-radius: var(--r1);
  background: transparent;
  color: var(--tx0);
  font-size: 12.5px;
  text-align: left;
  cursor: pointer;
  transition: background .13s;
}

.ctx-item svg { width: 15px; height: 15px; color: var(--tx2); }
.ctx-item:hover { background: var(--sheen); }
.ctx-sep { height: 1px; margin: 5px 8px; background: var(--chrome-line); }

/* toast */
#toastWrap {
  position: fixed;
  right: 16px;
  bottom: calc(var(--tb) + 14px);
  z-index: 960;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  pointer-events: none;
}

.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 15px;
  border-radius: var(--r2);
  border: 1px solid var(--chrome-line);
  background: var(--chrome);
  backdrop-filter: blur(26px);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  color: var(--tx0);
  animation: toastIn .34s var(--ease-out) both;
}

.toast svg { width: 15px; height: 15px; color: var(--ok); }
.toast.out { animation: toastOut .3s var(--ease-in) forwards; }

@keyframes toastIn { from { opacity: 0; transform: translateX(24px) } to { opacity: 1; transform: none } }
@keyframes toastOut { to { opacity: 0; transform: translateX(24px) } }

/* ============================================================
   IN-WINDOW UI KIT
   ============================================================ */
.eyeline {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--tx2);
}

.h-lg { font-size: 27px; line-height: 1.15; }
.h-md { font-size: 18px; line-height: 1.25; }
.h-sm { font-size: 14px; line-height: 1.3; }
.dim { color: var(--tx1); }
.dimmer { color: var(--tx2); }
.body-copy { font-size: 14px; line-height: 1.65; color: var(--tx1); }

.rule { height: 1px; background: var(--line); border: 0; margin: 22px 0; }

.card {
  padding: 17px 18px;
  border-radius: var(--r3);
  border: 1px solid var(--line);
  background: var(--bg2);
}

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }

.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--r1);
  border: 1px solid var(--line2);
  background: var(--bg3);
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--tx1);
  white-space: nowrap;
}

.tag.acc { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 14%, transparent); color: color-mix(in srgb, var(--accent) 78%, var(--tx0)); }
.tag.ok { border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 13%, transparent); color: color-mix(in srgb, var(--ok) 74%, var(--tx0)); }
.tag.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 13%, transparent); color: color-mix(in srgb, var(--warn) 74%, var(--tx0)); }
.tag.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 13%, transparent); color: color-mix(in srgb, var(--bad) 74%, var(--tx0)); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 36px;
  padding: 0 15px;
  border-radius: var(--r2);
  border: 1px solid transparent;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  transition: filter .16s, transform .12s var(--ease), background .16s, border-color .16s;
}

.btn svg { width: 15px; height: 15px; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.97); }

.btn.ghost { background: transparent; border-color: var(--line2); color: var(--tx0); }
.btn.ghost:hover { background: var(--bg3); border-color: var(--tx2); filter: none; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

a.link { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); transition: border-color .16s; }
a.link:hover { border-color: var(--accent); }

.field {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--r2);
  border: 1px solid var(--line2);
  background: var(--bg1);
  color: var(--tx0);
  font-size: 13.5px;
  outline: 0;
  transition: border-color .16s, box-shadow .16s;
}

.field::placeholder { color: var(--tx2); }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
textarea.field { min-height: 108px; resize: vertical; line-height: 1.6; }

/* spec table — OS-flavoured key/value */
.spec { display: grid; gap: 0; font-family: var(--f-mono); font-size: 12px; }
.spec div { display: grid; grid-template-columns: 108px 1fr; gap: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.spec div:last-child { border-bottom: 0; }
.spec dt, .spec b { color: var(--tx2); letter-spacing: .1em; text-transform: uppercase; font-size: 10px; font-weight: 500; align-self: center; }
.spec span { color: var(--tx0); }

/* proficiency meters */
.meter-row { display: grid; gap: 6px; }
.meter-row + .meter-row { margin-top: 13px; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.meter-top b { font-size: 12.5px; font-weight: 600; }
.meter-top small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; color: var(--tx2); }
.meter { height: 3px; border-radius: 3px; background: var(--bg4); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .9s var(--ease-out); }

/* split-pane apps */
.split { display: grid; grid-template-columns: 236px 1fr; height: 100%; min-height: 0; }
.split-side { border-right: 1px solid var(--line); background: var(--bg2); overflow: auto; padding: 12px 10px; }
.split-main { overflow: auto; min-width: 0; }

.side-label {
  padding: 10px 10px 7px;
  font-family: var(--f-mono);
  font-size: 9.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--tx2);
}

.side-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx1);
  font-size: 12.5px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background .15s, color .15s;
}

.side-item svg { width: 15px; height: 15px; flex: 0 0 auto; color: var(--tx2); }
.side-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item:hover { background: var(--bg3); color: var(--tx0); }
.side-item.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--tx0); }
.side-item.on svg { color: var(--accent); }

.fade-swap { animation: fadeSwap .32s var(--ease-out) both; }
@keyframes fadeSwap { from { opacity: 0; transform: translateY(9px) } to { opacity: 1; transform: none } }

/* timeline */
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line2); }
.tl-item { position: relative; padding-bottom: 26px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: "";
  position: absolute;
  left: -26px;
  top: 5px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2px solid var(--bg1);
  background: var(--line2);
  box-shadow: 0 0 0 1px var(--line2);
}
.tl-item.now::before { background: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 70%, transparent); }
.tl-date { font-family: var(--f-mono); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; color: var(--tx2); }
.tl-role { margin-top: 4px; font-size: 15px; }
.tl-org { margin-top: 2px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
.tl-list { margin: 9px 0 0; padding-left: 17px; font-size: 13px; line-height: 1.65; color: var(--tx1); }
.tl-list li { margin-bottom: 3px; }

/* case cards (blue team) */
.case { border-radius: var(--r3); border: 1px solid var(--line); background: var(--bg2); overflow: hidden; }
.case-h { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-bottom: 1px solid var(--line); background: var(--bg3); }
.case-id { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; color: var(--tx2); }
.case-h b { font-size: 13.5px; }
.case-b { padding: 15px; }
.case-b p { font-size: 13px; line-height: 1.62; color: var(--tx1); }
.ioc { margin-top: 12px; padding: 11px 13px; border-radius: var(--r2); background: var(--bg1); border: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; line-height: 1.85; color: var(--tx1); overflow-x: auto; }
.ioc em { color: var(--accent); font-style: normal; }

/* terminal */
.term {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  background: var(--bg0);
  font-family: var(--f-mono);
  font-size: 12.5px;
  line-height: 1.72;
  color: var(--tx1);
}

.term-out { flex: 1; min-height: 0; overflow: auto; }
.term-line { margin: 0; white-space: pre-wrap; word-break: break-word; }
.term-line a { color: var(--accent); }
.term-ok { color: var(--ok); }
.term-bad { color: var(--bad); }
.term-dim { color: var(--tx2); }
.term-hi { color: var(--tx0); }
.term-ps { color: var(--accent); }
.term-ps b { color: var(--ok); font-weight: 500; }
.term-in { display: flex; align-items: baseline; gap: 8px; padding-top: 4px; }
.term-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--tx0); font: inherit; caret-color: var(--accent); }
.term-art { color: var(--accent); }

/* notes */
.notes { height: 100%; display: flex; flex-direction: column; }
.notes-bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--bg2); font-size: 11.5px; color: var(--tx2); }
.notes textarea { flex: 1; border: 0; outline: 0; resize: none; padding: 20px 22px; background: var(--bg1); color: var(--tx0); font-family: var(--f-mono); font-size: 13px; line-height: 1.75; }

/* calculator */
.calc { height: 100%; display: flex; flex-direction: column; padding: 14px; gap: 12px; background: var(--bg2); }
.calc-out { padding: 16px 14px 14px; border-radius: var(--r3); background: var(--bg1); border: 1px solid var(--line); text-align: right; }
.calc-prev { font-family: var(--f-mono); font-size: 11.5px; color: var(--tx2); min-height: 17px; overflow: hidden; text-overflow: ellipsis; }
.calc-now { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 31px; font-weight: 300; letter-spacing: -.02em; overflow: hidden; text-overflow: ellipsis; }
.calc-pad { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 7px; }
.ckey {
  border: 1px solid var(--line);
  border-radius: var(--r2);
  background: var(--bg1);
  color: var(--tx0);
  font-family: var(--f-mono);
  font-size: 15px;
  cursor: pointer;
  transition: background .12s, transform .1s var(--ease), border-color .12s;
}
.ckey:hover { background: var(--bg3); border-color: var(--line2); }
.ckey:active { transform: scale(.95); }
.ckey.fn { color: var(--tx1); background: var(--bg3); }
.ckey.op { color: var(--accent); }
.ckey.eq { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ckey.wide { grid-column: span 2; }

/* minesweeper */
.ms { height: 100%; display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 15px; background: var(--bg2); }
.ms-bar { width: 100%; max-width: 372px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: var(--r2); border: 1px solid var(--line); background: var(--bg1); }
.ms-count { display: flex; align-items: center; gap: 7px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--tx0); }
.ms-count svg { width: 14px; height: 14px; color: var(--tx2); }
.ms-face { border: 1px solid var(--line2); background: var(--bg3); border-radius: var(--r1); padding: 5px 12px; cursor: pointer; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--tx1); transition: background .14s, color .14s; }
.ms-face:hover { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ms-grid { display: grid; gap: 2px; padding: 6px; border-radius: var(--r2); background: var(--bg0); border: 1px solid var(--line); }
.cell {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line2);
  border-radius: 2px;
  background: var(--bg3);
  font-family: var(--f-mono);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  color: var(--tx0);
  transition: background .1s, transform .08s;
}
.cell:hover:not(.open) { background: var(--bg4); }
.cell:active { transform: scale(.92); }
.cell.open { background: var(--bg1); border-color: var(--line); cursor: default; }
.cell.mine { background: color-mix(in srgb, var(--bad) 32%, var(--bg1)); border-color: var(--bad); }
.cell.flag { color: var(--warn); }
.cell.n1 { color: #5b9cfa } .cell.n2 { color: #22c7a0 } .cell.n3 { color: #f1616f }
.cell.n4 { color: #9a6bff } .cell.n5 { color: #f2a93b } .cell.n6 { color: #34b7e8 }
.cell.n7 { color: var(--tx0) } .cell.n8 { color: var(--tx2) }
.ms-msg { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--tx2); }

/* files */
.file-row {
  display: grid;
  grid-template-columns: 1fr 96px 76px;
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 9px 14px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--tx0);
  text-align: left;
  cursor: pointer;
  font-size: 13px;
  transition: background .13s;
}
.file-row:hover { background: var(--bg2); }
.file-row .fn { display: flex; align-items: center; gap: 10px; min-width: 0; }
.file-row .fn svg { width: 16px; height: 16px; color: var(--accent); flex: 0 0 auto; }
.file-row .fn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .meta { font-family: var(--f-mono); font-size: 10.5px; color: var(--tx2); }
.file-head { position: sticky; top: 0; background: var(--bg2); border-bottom: 1px solid var(--line2); }
.file-head .meta, .file-head .fn { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--tx2); }

.crumbs { display: flex; align-items: center; gap: 7px; padding: 11px 14px; border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-size: 11px; color: var(--tx2); }
.crumbs b { color: var(--tx0); font-weight: 500; }

/* settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row p { font-size: 12.5px; color: var(--tx2); margin-top: 2px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: var(--r2); border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line2); cursor: pointer; padding: 0; transition: transform .16s var(--ease), box-shadow .16s; }
.sw:hover { transform: scale(1.1); }
.sw.on { border-color: var(--bg1); box-shadow: 0 0 0 2px var(--accent); }
.sw.wp { width: 62px; height: 40px; }

.seg { display: flex; padding: 3px; gap: 3px; border-radius: var(--r2); border: 1px solid var(--line2); background: var(--bg2); }
.seg button { border: 0; background: transparent; color: var(--tx1); padding: 6px 13px; border-radius: var(--r1); font-size: 12px; font-weight: 600; cursor: pointer; transition: background .15s, color .15s; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

.toggle { position: relative; width: 44px; height: 25px; flex: 0 0 auto; border: 0; padding: 0; border-radius: 99px; background: var(--bg4); cursor: pointer; transition: background .22s var(--ease); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: var(--tx2); transition: transform .26s var(--ease-out), background .22s; }
.toggle.on { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.toggle.on::after { transform: translateX(19px); background: var(--accent); }

/* resume */
.pdf-frame { width: 100%; height: 420px; border: 1px solid var(--line); border-radius: var(--r3); background: var(--bg2); }
.pdf-fallback { display: grid; place-items: center; height: 100%; text-align: center; padding: 30px; }

/* project detail */
.proj-hero { padding: 26px 26px 22px; border-bottom: 1px solid var(--line); background: var(--bg2); }
.proj-body { padding: 22px 26px 28px; }

/* contact */
.clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.clist a { display: flex; align-items: center; gap: 11px; padding: 10px 11px; margin: 0 -11px; border-radius: var(--r2); color: var(--tx0); text-decoration: none; font-size: 13px; transition: background .14s; }
.clist a:hover { background: var(--bg3); }
.clist svg { width: 16px; height: 16px; color: var(--accent); flex: 0 0 auto; }
.clist small { margin-left: auto; font-family: var(--f-mono); font-size: 10px; color: var(--tx2); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  :root { --tb: 58px; }

  .desk-icons {
    inset: 14px 12px calc(var(--tb) + 92px) 12px;
    grid-auto-flow: row;
    grid-template-rows: none;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    grid-auto-rows: 92px;
    gap: 4px;
    align-content: start;
  }

  .dicon { width: 100%; }
  .kbd-hint { display: none; }

  .win {
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 0;
    border: 0;
    transform: none !important;
  }

  .rz { display: none; }
  .wbtn.mx { display: none; }
  .wpad { padding: 18px 16px 24px; }

  .split { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .split-side { border-right: 0; border-bottom: 1px solid var(--line); max-height: 152px; }

  .grid2, .grid3 { grid-template-columns: 1fr; }
  .tb-app span { display: none; }
  .tb-app { padding: 0 11px; }

  #startMenu { left: 8px; right: 8px; width: auto; margin-left: 0; }
  .sm-grid { grid-template-columns: repeat(4, 1fr); }
  #widgetPanel { left: 8px; right: 8px; width: auto; }
  #taskView { padding: 40px 16px calc(var(--tb) + 24px); }
  .spec div { grid-template-columns: 88px 1fr; gap: 10px; }
  .file-row { grid-template-columns: 1fr 70px; }
  .file-row .meta.hide-sm { display: none; }
  .lock-inner { padding: 24px; }
}

@media (max-width: 560px) {
  .sm-grid { grid-template-columns: repeat(3, 1fr); }
  .tb-mid { gap: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
}

/* ============================================================
   POMODORO TIMER
   ============================================================ */
.timer-wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 24px;
  background: var(--bg2);
}

.timer-modes {
  display: flex;
  gap: 5px;
  padding: 4px;
  border-radius: var(--r3);
  background: var(--bg1);
  border: 1px solid var(--line);
}

.timer-mode {
  padding: 6px 14px;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx2);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  cursor: pointer;
  transition: background .16s, color .16s;
}

.timer-mode.on { background: var(--accent); color: var(--accent-ink); }

.timer-ring-wrap {
  position: relative;
  width: 200px;
  height: 200px;
}

.timer-ring-wrap svg { transform: rotate(-90deg); }

.timer-ring-bg { fill: none; stroke: var(--bg4); stroke-width: 8; }
.timer-ring-fg {
  fill: none;
  stroke: var(--accent);
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 565;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset .8s var(--ease-out), stroke .4s;
  filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent));
}

.timer-display {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.timer-time {
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 42px;
  font-weight: 300;
  letter-spacing: -.03em;
  color: var(--tx0);
  line-height: 1;
}

.timer-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--tx2);
}

.timer-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.timer-btn {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line2);
  border-radius: 50%;
  background: var(--bg1);
  color: var(--tx1);
  cursor: pointer;
  transition: background .16s, color .16s, border-color .16s, transform .14s var(--ease);
}

.timer-btn:hover { background: var(--bg3); color: var(--tx0); border-color: var(--line2); }
.timer-btn:active { transform: scale(.92); }
.timer-btn.primary { width: 58px; height: 58px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.timer-btn.primary:hover { filter: brightness(1.12); }

.timer-sessions {
  display: flex;
  gap: 6px;
}

.timer-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bg4);
  border: 1px solid var(--line2);
  transition: background .3s, border-color .3s;
}

.timer-dot.done { background: var(--accent); border-color: var(--accent); }

/* ============================================================
   ACTIVITY MONITOR / SYSMON
   ============================================================ */
.sysmon {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg0);
  font-family: var(--f-mono);
}

.sysmon-tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  background: var(--bg1);
  padding: 0 14px;
}

.sysmon-tab {
  padding: 11px 14px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--tx2);
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color .16s, border-color .16s;
  margin-bottom: -1px;
}

.sysmon-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.sysmon-tab:hover:not(.on) { color: var(--tx0); }

.sysmon-pane { flex: 1; overflow: auto; padding: 16px; display: none; }
.sysmon-pane.on { display: block; }

.sysmon-graph-wrap {
  border-radius: var(--r2);
  border: 1px solid var(--line);
  background: var(--bg1);
  overflow: hidden;
  margin-bottom: 16px;
}

.sysmon-graph-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}

.sysmon-graph-head b { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--tx2); }
.sysmon-graph-head span { font-size: 13px; color: var(--tx0); }

.sysmon-canvas-wrap {
  position: relative;
  height: 80px;
  padding: 10px;
}

.sysmon-canvas-wrap canvas { width: 100%; height: 100%; }

.sysmon-proc-head {
  display: grid;
  grid-template-columns: 1fr 80px 80px 80px;
  gap: 10px;
  padding: 7px 12px;
  font-size: 9.5px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--tx2);
  border-bottom: 1px solid var(--line);
}

.sysmon-proc-row {
  display: grid;
  grid-template-columns: 1fr 80px 80px 80px;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  transition: background .12s;
  cursor: default;
}

.sysmon-proc-row:hover { background: var(--bg2); }
.sysmon-proc-row:last-child { border-bottom: 0; }
.sysmon-proc-row .name { font-size: 12px; color: var(--tx0); }
.sysmon-proc-row .pid { font-size: 11px; color: var(--tx2); }
.sysmon-proc-row .cpu-val { font-size: 11.5px; color: var(--ok); text-align: right; }
.sysmon-proc-row .mem-val { font-size: 11.5px; color: var(--accent); text-align: right; }
.sysmon-proc-row .stat { font-size: 11px; color: var(--tx2); text-align: right; }

.sysmon-stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.sysmon-stat {
  border-radius: var(--r2);
  border: 1px solid var(--line);
  background: var(--bg1);
  padding: 12px 14px;
}

.sysmon-stat small { font-size: 9.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--tx2); display: block; }
.sysmon-stat b { font-size: 22px; font-weight: 300; color: var(--tx0); display: block; margin-top: 4px; }
.sysmon-stat .bar { height: 3px; border-radius: 3px; background: var(--bg4); margin-top: 8px; overflow: hidden; }
.sysmon-stat .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width 1.2s var(--ease-out); }

/* ============================================================
   MUSIC / AMBIENT PLAYER
   ============================================================ */
.music-wrap {
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 0;
  background: var(--bg2);
}

.music-head {
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--line);
}

.music-now {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 18px;
}

.music-art {
  width: 58px;
  height: 58px;
  border-radius: var(--r3);
  display: grid;
  place-items: center;
  font-size: 24px;
  background: linear-gradient(150deg, var(--bg4), var(--bg3));
  border: 1px solid var(--line2);
  flex: 0 0 auto;
}

.music-info { flex: 1; min-width: 0; }
.music-title { font-family: var(--f-display); font-size: 16px; font-weight: 600; color: var(--tx0); }
.music-sub { font-size: 12px; color: var(--tx2); margin-top: 3px; }

.music-vis {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 28px;
  margin-left: auto;
  flex: 0 0 auto;
}

.music-bar {
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
  transition: height .15s var(--ease-out);
  opacity: .8;
}

.music-ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
}

.music-ctrl-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r2);
  background: transparent;
  color: var(--tx2);
  cursor: pointer;
  transition: background .14s, color .14s, transform .12s;
}

.music-ctrl-btn:hover { background: var(--bg3); color: var(--tx0); }
.music-ctrl-btn:active { transform: scale(.9); }
.music-ctrl-btn.on { color: var(--accent); }

.music-play-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: filter .14s, transform .12s;
  margin: 0 4px;
}

.music-play-btn:hover { filter: brightness(1.14); }
.music-play-btn:active { transform: scale(.93); }

.music-vol {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
  color: var(--tx2);
}

.music-vol input[type=range] {
  width: 80px;
  accent-color: var(--accent);
  cursor: pointer;
}

.music-scenes {
  flex: 1;
  padding: 16px 22px;
  overflow: auto;
}

.music-scenes-label {
  font-family: var(--f-mono);
  font-size: 10px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--tx2);
  margin-bottom: 12px;
}

.music-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.music-scene {
  padding: 14px 16px;
  border-radius: var(--r3);
  border: 1px solid var(--line);
  background: var(--bg1);

function svg(name, size) {
  const p = ICONS[name] || ICONS.doc;
  const s = size || 24;
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

function hydrateIcons(root) {
  (root || document).querySelectorAll("[data-icon]").forEach(el => {
    if (el.dataset.iconDone) return;
    el.dataset.iconDone = "1";
    el.innerHTML = svg(el.dataset.icon);
  });
}

const $ = (s, r) => (r || document).querySelector(s);

function fmtTime(d) {
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function toast(msg, icon) {
  const wrap = $("#toastWrap");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = svg(icon || "check", 15) + "<span>" + esc(msg) + "</span>";
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 320);
  }, 2400);
}

/* ------------------------------------------------------------
   5 · LOCK → LOGIN → BOOT
   ------------------------------------------------------------ */
const BOOT_STEPS = [
  "Mounting /home/" + PROFILE.handle,
  "Starting window manager",
  "Loading applications",
  "Restoring session",
  "Ready"
];

function tickLockClock() {
  const d = new Date();
  const t = fmtTime(d).replace(":", "<b>:</b>");
  const lt = $("#lockTime");
  if (lt) lt.innerHTML = t;
  const ld = $("#lockDate");
  if (ld) ld.textContent = d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });
}

function startSignIn() {
  const stage = $("#stage");
  if (stage.classList.contains("signing")) return;
  stage.classList.add("signing");
  setTimeout(() => { const i = $("#pwInput"); if (i) i.focus(); }, 420);
}

function runBoot() {
  const stage = $("#stage");
  if (stage.classList.contains("booting")) return;
  stage.classList.add("booting");

  const bar = $("#bootBar");
  const status = $("#bootStatus");
  const fast = reduced();
  let i = 0;

  const step = () => {
    if (i >= BOOT_STEPS.length) {
      setTimeout(finishBoot, fast ? 60 : 320);
      return;
    }
    status.textContent = BOOT_STEPS[i];
    bar.style.width = Math.round(((i + 1) / BOOT_STEPS.length) * 100) + "%";
    i++;
    setTimeout(step, fast ? 40 : 300 + Math.random() * 200);
  };

  setTimeout(step, fast ? 20 : 260);
}

function finishBoot() {
  const stage = $("#stage");
  stage.classList.add("done");
  $("#desktop").classList.add("ready");
  setTimeout(() => { stage.style.display = "none"; }, reduced() ? 30 : 700);
}

function lockSession(signOut) {
  const stage = $("#stage");
  closeAllWindows(true);
  $("#desktop").classList.remove("ready");
  closePanels();
  stage.style.display = "";
  stage.classList.remove("done", "booting", "signing", "lit");
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add("lit")));
  $("#bootBar").style.width = "0%";
  if (signOut) $("#pwInput").value = "••••••••";
  tickLockClock();
}

/* ------------------------------------------------------------
   6 · WINDOW MANAGER
   ------------------------------------------------------------ */
const wins = new Map();      // appId -> element
const tbBtns = new Map();    // appId -> taskbar button
let zTop = 100;
let activeId = null;
let cascade = 0;

function layerBox() {
  const l = $("#winLayer");
  return { w: l.clientWidth, h: l.clientHeight };
}

function openApp(appId, origin) {
  const app = APPS[appId];
  if (!app) return;

  const existing = wins.get(appId);
  if (existing) {
    const wasMin = existing.classList.contains("min");
    existing.classList.remove("min");
    focusWin(existing);
    if (wasMin) transformIn(existing, origin || tbBtns.get(appId));
    else nudge(existing);
    return existing;
  }

  const win = document.createElement("section");
  win.className = "win";
  win.dataset.app = appId;

  const box = layerBox();
  const w = Math.min(app.w || 760, box.w - 24);
  const h = Math.min(app.h || 500, box.h - 24);
  const off = (cascade++ % 6) * 30;
  const left = Math.max(12, Math.round((box.w - w) / 2 - 90 + off));
  const top = Math.max(12, Math.round((box.h - h) / 2 - 40 + off));

  win.style.width = w + "px";
  win.style.height = h + "px";
  win.style.left = left + "px";
  win.style.top = top + "px";

  win.innerHTML =
    '<header class="titlebar">' +
      '<span class="tt-icon">' + svg(app.icon, 16) + "</span>" +
      '<span class="tt-name">' + esc(app.title) + "</span>" +
      '<div class="tt-ctrl">' +
        '<button class="wbtn mn" title="Minimize">' + svg("min", 15) + "</button>" +
        '<button class="wbtn mx" title="Maximize">' + svg("max", 15) + "</button>" +
        '<button class="wbtn x" title="Close">' + svg("close", 15) + "</button>" +
      "</div>" +
    "</header>" +
    '<div class="wbody">' + app.render() + "</div>" +
    ["n", "s", "w", "e", "nw", "ne", "sw", "se"].map(d => '<i class="rz ' + d + '" data-rz="' + d + '"></i>').join("");

  $("#winLayer").appendChild(win);
  wins.set(appId, win);

  wireWindow(win, appId);
  addTaskButton(appId);
  focusWin(win);
  transformIn(win, origin);
  hydrateIcons(win);

  if (app.mount) app.mount(win);
  refreshTaskView();
  return win;
}

function wireWindow(win, appId) {
  win.addEventListener("pointerdown", () => focusWin(win), true);
  $(".x", win).addEventListener("click", e => { e.stopPropagation(); closeWindow(appId); });
  $(".mn", win).addEventListener("click", e => { e.stopPropagation(); minimizeWindow(appId); });
  $(".mx", win).addEventListener("click", e => { e.stopPropagation(); toggleMax(win); });

  const bar = $(".titlebar", win);
  bar.addEventListener("dblclick", e => { if (!e.target.closest(".wbtn")) toggleMax(win); });
  bar.addEventListener("pointerdown", e => startDrag(e, win));
  $$(".rz", win).forEach(h => h.addEventListener("pointerdown", e => startResize(e, win, h.dataset.rz)));
}

function focusWin(win) {
  if (!win) return;
  const id = win.dataset.app;
  activeId = id;
  win.classList.remove("min");
  win.style.zIndex = ++zTop;
  $$(".win").forEach(w => w.classList.toggle("active", w === win));
  tbBtns.forEach((b, k) => b.classList.toggle("live", k === id));
}

function closeWindow(appId) {
  const win = wins.get(appId);
  const btn = tbBtns.get(appId);
  if (win) {
    if (win._cleanup) win._cleanup();
    if (reduced()) win.remove();
    else {
      win.style.transition = "transform .17s var(--ease-in), opacity .17s ease";
      win.style.transform = "scale(.94)";
      win.style.opacity = "0";
      setTimeout(() => win.remove(), 180);
    }
  }
  if (btn) btn.remove();
  wins.delete(appId);
  tbBtns.delete(appId);
  if (activeId === appId) activeId = null;
  refreshTaskView();
}

function closeAllWindows(silent) {
  Array.from(wins.keys()).forEach(id => closeWindow(id));
  cascade = 0;
  if (!silent) toast("All windows closed");
}

function minimizeWindow(appId) {
  const win = wins.get(appId);
  if (!win) return;
  const btn = tbBtns.get(appId);
  win.classList.remove("active");
  if (btn) btn.classList.remove("live");
  if (activeId === appId) activeId = null;

  if (reduced()) { win.classList.add("min"); return; }

  const wr = win.getBoundingClientRect();
  const br = btn ? btn.getBoundingClientRect() : { left: wr.left, top: window.innerHeight, width: 40, height: 40 };
  const dx = (br.left + br.width / 2) - (wr.left + wr.width / 2);
  const dy = (br.top + br.height / 2) - (wr.top + wr.height / 2);

  win.style.transformOrigin = "center";
  win.style.transition = "transform .3s var(--ease-in), opacity .26s ease";
  win.style.transform = `translate(${dx}px, ${dy}px) scale(.08)`;
  win.style.opacity = "0";

  setTimeout(() => {
    win.classList.add("min");
    win.style.transition = "";
    win.style.transform = "";
    win.style.opacity = "";
  }, 300);
}

function toggleMax(win) {
  if (isMobile()) return;
  if (win.classList.contains("max")) {
    const s = win._pre;
    win.classList.remove("max");
    if (s) { win.style.left = s.left; win.style.top = s.top; win.style.width = s.width; win.style.height = s.height; }
    $(".mx", win).innerHTML = svg("max", 15);
  } else {
    win._pre = { left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height };
    win.classList.add("max");
    const b = layerBox();
    win.style.left = "0px"; win.style.top = "0px";
    win.style.width = b.w + "px"; win.style.height = b.h + "px";
    $(".mx", win).innerHTML = svg("restore", 15);
  }
  win.classList.add("snapping");
  setTimeout(() => win.classList.remove("snapping"), 240);
}

function transformIn(win, origin) {
  if (reduced()) return;
  const t = win.getBoundingClientRect();
  let o;
  if (origin && origin.getBoundingClientRect) o = origin.getBoundingClientRect();
  else o = { left: t.left + t.width / 2 - 16, top: t.top + t.height / 2 - 16, width: 32, height: 32 };

  const dx = (o.left + o.width / 2) - (t.left + t.width / 2);
  const dy = (o.top + o.height / 2) - (t.top + t.height / 2);
  const sc = Math.max(.1, Math.min(o.width / Math.max(t.width, 1), .34));

  win.style.transformOrigin = "center";
  win.style.transition = "none";
  win.style.opacity = "0";
  win.style.transform = `translate(${dx}px, ${dy}px) scale(${sc})`;

  requestAnimationFrame(() => requestAnimationFrame(() => {
    win.style.transition = "transform .38s var(--ease-out), opacity .22s ease";
    win.style.opacity = "1";
    win.style.transform = "none";
    setTimeout(() => { win.style.transition = ""; win.style.transform = ""; }, 400);
  }));
}

function nudge(win) {
  if (reduced()) return;
  win.animate(
    [{ transform: "scale(1)" }, { transform: "scale(1.012)" }, { transform: "scale(1)" }],
    { duration: 240, easing: "cubic-bezier(.2,.85,.25,1)" }
  );
}

/* drag + edge snap */
function startDrag(e, win) {
  if (e.target.closest(".wbtn") || e.button !== 0 || isMobile()) return;
  e.preventDefault();

  const layer = $("#winLayer");
  const box = layerBox();
  const ghost = $("#snapGhost");
  let zone = null;

  let r = win.getBoundingClientRect();
  const lr = layer.getBoundingClientRect();

  if (win.classList.contains("max")) {
    const ratio = (e.clientX - r.left) / r.width;
    const s = win._pre || { width: "760px", height: "500px" };
    win.classList.remove("max");
    win.style.width = s.width; win.style.height = s.height;
    $(".mx", win).innerHTML = svg("max", 15);
    r = win.getBoundingClientRect();
    win.style.left = (e.clientX - lr.left - r.width * ratio) + "px";
    win.style.top = (e.clientY - lr.top - 20) + "px";
    r = win.getBoundingClientRect();
  }

  const offX = e.clientX - r.left;
  const offY = e.clientY - r.top;

  win.classList.add("dragging");
  win.setPointerCapture(e.pointerId);

  const move = ev => {
    let x = ev.clientX - lr.left - offX;
    let y = ev.clientY - lr.top - offY;
    x = Math.max(-r.width + 90, Math.min(box.w - 90, x));
    y = Math.max(0, Math.min(box.h - 44, y));
    win.style.left = x + "px";
    win.style.top = y + "px";

    const px = ev.clientX - lr.left;
    const py = ev.clientY - lr.top;
    let nz = null;
    if (py <= 6) nz = "top";
    else if (px <= 6) nz = "left";
    else if (px >= box.w - 6) nz = "right";

    if (nz !== zone) {
      zone = nz;
      if (!zone) ghost.classList.remove("on");
      else {
        ghost.classList.add("on");
        const g = zoneRect(zone, box);
        ghost.style.left = g.x + "px"; ghost.style.top = g.y + "px";
        ghost.style.width = g.w + "px"; ghost.style.height = g.h + "px";
      }
    }
  };

  const up = () => {
    win.classList.remove("dragging");
    ghost.classList.remove("on");
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    if (!zone) return;
    if (zone === "top") { toggleMax(win); return; }
    const g = zoneRect(zone, box);
    win._pre = { left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height };
    win.classList.add("snapping");
    win.style.left = g.x + "px"; win.style.top = g.y + "px";
    win.style.width = g.w + "px"; win.style.height = g.h + "px";
    setTimeout(() => win.classList.remove("snapping"), 240);
  };

  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

function zoneRect(zone, box) {
  if (zone === "top") return { x: 0, y: 0, w: box.w, h: box.h };
  if (zone === "left") return { x: 0, y: 0, w: Math.round(box.w / 2), h: box.h };
  return { x: Math.round(box.w / 2), y: 0, w: Math.round(box.w / 2), h: box.h };
}

/* resize */
function startResize(e, win, dir) {
  if (isMobile() || win.classList.contains("max")) return;
  e.preventDefault();
  e.stopPropagation();
  focusWin(win);

  const box = layerBox();
  const sx = e.clientX, sy = e.clientY;
  const L = parseFloat(win.style.left), T = parseFloat(win.style.top);
  const W = win.offsetWidth, H = win.offsetHeight;
  const MIN_W = 300, MIN_H = 200;

  win.classList.add("dragging");

  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let l = L, t = T, w = W, h = H;

    if (dir.includes("e")) w = Math.max(MIN_W, Math.min(W + dx, box.w - L));
    if (dir.includes("s")) h = Math.max(MIN_H, Math.min(H + dy, box.h - T));
    if (dir.includes("w")) { const nw = Math.max(MIN_W, Math.min(W - dx, L + W)); l = L + W - nw; w = nw; }
    if (dir.includes("n")) { const nh = Math.max(MIN_H, Math.min(H - dy, T + H)); t = T + H - nh; h = nh; }

    win.style.left = l + "px"; win.style.top = t + "px";
    win.style.width = w + "px"; win.style.height = h + "px";
  };

  const up = () => {
    win.classList.remove("dragging");
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
  };

  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

/* taskbar buttons */
function addTaskButton(appId) {
  const app = APPS[appId];
  const b = document.createElement("button");
  b.className = "tb-app";
  b.title = app.title;
  b.innerHTML = svg(app.icon, 17) + "<span>" + esc(app.title) + "</span>";
  b.addEventListener("click", () => {
    const win = wins.get(appId);
    if (!win) return;
    if (win.classList.contains("min")) { win.classList.remove("min"); focusWin(win); transformIn(win, b); }
    else if (activeId === appId) minimizeWindow(appId);
    else { focusWin(win); nudge(win); }
  });
  $("#tbApps").appendChild(b);
  tbBtns.set(appId, b);
}

/* cycle windows (Alt+Tab style) */
function cycleWindows() {
  const ids = Array.from(wins.keys());
  if (!ids.length) return;
  const i = ids.indexOf(activeId);
  const next = wins.get(ids[(i + 1) % ids.length]);
  next.classList.remove("min");
  focusWin(next);
  nudge(next);
}
