/* ============================================================
   TERMINAL
   ============================================================ */
function mountTerminal(win) {
  const out = $("#tOut", win);
  const inp = $("#tIn", win);
  const hist = [];
  let hi = -1;

  const say = (html, cls) => {
    const p = document.createElement("p");
    p.className = "term-line" + (cls ? " " + cls : "");
    p.innerHTML = html;
    out.appendChild(p);
    out.scrollTop = out.scrollHeight;
  };

  const CMDS = {
    help: () => [
      '<span class="term-hi">Available commands</span>',
      '  <span class="term-ok">help</span>           this list',
      '  <span class="term-ok">whoami</span>         short introduction',
      '  <span class="term-ok">skills</span>         capability summary',
      '  <span class="term-ok">achievements</span>   awards & recognition',
      '  <span class="term-ok">quote</span>          random dev quote',
      '  <span class="term-ok">projects</span>    project index',
      '  <span class="term-ok">exp</span>         experience timeline',
      '  <span class="term-ok">security</span>    blue team casework',
      '  <span class="term-ok">contact</span>     how to reach me',
      '  <span class="term-ok">open</span> [app]  launch an application',
      '  <span class="term-ok">theme</span> [d|l] switch appearance',
      '  <span class="term-ok">accent</span> [n]  ' + ACCENTS.map(a => a.id).join(", "),
      '  <span class="term-ok">neofetch</span>    system summary',
      '  <span class="term-ok">date</span>        current date and time',
      '  <span class="term-ok">clear</span>       wipe the screen',
      '  <span class="term-dim">tab completes · ↑ ↓ walks history</span>'
    ].join("\n"),

    whoami: () => `<span class="term-hi">${esc(PROFILE.name)}</span> — ${esc(PROFILE.role)}\n${esc(PROFILE.location)}\n\n${esc(PROFILE.summary)}`,

    skills: () => PROFILE.skills.map(g =>
      `<span class="term-hi">${esc(g.group)}</span>\n` +
      g.items.map(s => {
        const n = Math.round(s.level / 5);
        return "  " + s.name.padEnd(34, " ").slice(0, 34) + ' <span class="term-ps">' + "█".repeat(n) + '</span><span class="term-dim">' + "░".repeat(20 - n) + "</span>";
      }).join("\n")
    ).join("\n\n"),

    projects: () => PROFILE.projects.map(p =>
      `<span class="term-ok">${esc(p.name)}</span> <span class="term-dim">(${esc(p.year)} · ${esc(p.kind)})</span>\n  ${esc(p.description)}\n  <a href="${p.url}" target="_blank" rel="noreferrer">${esc(p.url)}</a>`
    ).join("\n\n"),

    achievements: () => PROFILE.achievements.map((a, i) =>
      `<span class="term-ok">[${i + 1}]</span> <span class="term-hi">${esc(a.title)}</span> <span class="term-dim">${esc(a.when)}</span>\n  ${esc(a.detail)}`
    ).join("\n\n"),

    quote: () => {
      const q = PROFILE.quotes[Math.floor(Math.random() * PROFILE.quotes.length)];
      return `<span class="term-hi">"${esc(q)}"</span>`;
    },

    exp: () => PROFILE.experience.map(e =>
      `<span class="term-dim">${esc(e.date)}</span>\n<span class="term-hi">${esc(e.role)}</span> — ${esc(e.org)}`
    ).join("\n\n"),

    security: () => PROFILE.cases.map(c =>
      `<span class="term-ok">${esc(c.id)}</span> ${esc(c.title)} <span class="term-dim">[${esc(c.severity)}]</span>\n  ${esc(c.summary)}`
    ).join("\n\n"),

    contact: () => [
      "Email     <a href=\"mailto:" + PROFILE.email + "\">" + esc(PROFILE.email) + "</a>",
      "GitHub    <a href=\"" + PROFILE.links.github + "\" target=\"_blank\">" + esc(PROFILE.links.github) + "</a>",
      "LinkedIn  <a href=\"" + PROFILE.links.linkedin + "\" target=\"_blank\">" + esc(PROFILE.links.linkedin) + "</a>"
    ].join("\n"),

    date: () => new Date().toString(),

    neofetch: () => {
      const art = [
        "      ╱╲      ",
        "     ╱  ╲     ",
        "    ╱ ╱╲ ╲    ",
        "   ╱ ╱  ╲ ╲   ",
        "  ╱ ╱____╲ ╲  ",
        " ╱__________╲ "
      ];
      const info = [
        `<span class="term-ok">${esc(PROFILE.handle)}</span>@<span class="term-ok">axiom</span>`,
        "─────────────────────────",
        `<span class="term-hi">OS</span>       ${esc(PROFILE.osName)} ${esc(PROFILE.build)}`,
        `<span class="term-hi">Host</span>     ${esc(PROFILE.name)}`,
        `<span class="term-hi">Role</span>     ${esc(PROFILE.role)}`,
        `<span class="term-hi">Shell</span>    axiom-sh`,
        `<span class="term-hi">Theme</span>    ${SHELL.theme} / ${SHELL.accent}`,
        `<span class="term-hi">Apps</span>     ${Object.keys(APPS).length} installed`,
        `<span class="term-hi">Uptime</span>   ${Math.max(1, Math.round((Date.now() - BOOT_AT) / 1000))}s`
      ];
      const rows = Math.max(art.length, info.length);
      let s = "";
      for (let i = 0; i < rows; i++) {
        s += '<span class="term-art">' + (art[i] || "              ") + "</span>  " + (info[i] || "") + "\n";
      }
      return s.trimEnd();
    }
  };

  const NAMES = Object.keys(CMDS).concat(["open", "theme", "accent", "wall", "clear", "sudo", "exit"]);

  const run = raw => {
    const line = raw.trim();
    if (!line) return;
    hist.unshift(line);
    hi = -1;

    const [cmd, ...args] = line.split(/\s+/);
    const c = cmd.toLowerCase();

    if (c === "clear") { out.innerHTML = ""; return; }
    if (c === "exit") { closeWindow("terminal"); return; }
    if (c === "sudo") { say("Nice try. This session has no elevated rights.", "term-bad"); return; }

    if (c === "open") {
      const key = (args[0] || "").toLowerCase();
      if (APPS[key]) { openApp(key); say("Launching " + APPS[key].title + "…", "term-ok"); }
      else say("Unknown application. Try: " + Object.keys(APPS).filter(k => APPS[k].desk).join(", "), "term-bad");
      return;
    }

    if (c === "theme") {
      const v = (args[0] || "").toLowerCase();
      const next = v === "l" || v === "light" ? "light" : v === "d" || v === "dark" ? "dark" : (SHELL.theme === "dark" ? "light" : "dark");
      SHELL.theme = next; store.set("theme", next); applyTheme();
      say("Appearance set to " + next + ".", "term-ok");
      return;
    }

    if (c === "accent") {
      const a = ACCENTS.find(x => x.id === (args[0] || "").toLowerCase());
      if (!a) { say("Available accents: " + ACCENTS.map(x => x.id).join(", "), "term-bad"); return; }
      SHELL.accent = a.id; store.set("accent", a.id); applyAccent();
      say("Accent set to " + a.label + ".", "term-ok");
      return;
    }

    if (c === "wall") {
      const id = (args[0] || "").toLowerCase();
      const w = WALLS.find(x => x.id === id);
      if (!w) { say("Available wallpapers: " + WALLS.map(x => x.id).join(", "), "term-bad"); return; }
      SHELL.wall = w.id; store.set("wall", w.id); applyWall();
      say("Wallpaper set to " + w.label + ".", "term-ok");
      return;
    }

    if (CMDS[c]) { say(CMDS[c]()); return; }
    say("axiom-sh: command not found: " + esc(cmd) + " — try <span class=\"term-ok\">help</span>", "term-bad");
  };

  say('<span class="term-hi">' + esc(PROFILE.osName) + " " + esc(PROFILE.build) + '</span> · axiom-sh');
  say('Type <span class="term-ok">help</span> for the command list.', "term-dim");
  say("");

  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const v = inp.value;
      say('<span class="term-ps"><b>' + esc(PROFILE.handle) + "</b>@axiom:~$</span> " + esc(v));
      inp.value = "";
      run(v);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (hi < hist.length - 1) { hi++; inp.value = hist[hi]; }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (hi > 0) { hi--; inp.value = hist[hi]; } else { hi = -1; inp.value = ""; }
    } else if (e.key === "Tab") {
      e.preventDefault();
      const cur = inp.value.trim().toLowerCase();
      const hit = NAMES.find(n => n.startsWith(cur) && cur);
      if (hit) inp.value = hit + " ";
    }
  });

  $(".term", win).addEventListener("click", e => { if (!window.getSelection().toString()) inp.focus(); });
  setTimeout(() => inp.focus(), 120);
}

/* ============================================================
   CALCULATOR
   ============================================================ */
function mountCalc(win) {
  const nowEl = $("#kNow", win), prevEl = $("#kPrev", win);
  let cur = "0", prev = null, op = null, fresh = true;

  const show = () => {
    nowEl.textContent = cur.length > 14 ? Number(cur).toPrecision(10) : cur;
    prevEl.textContent = prev !== null && op ? prev + " " + op : "";
  };

  const calc = () => {
    const a = parseFloat(prev), b = parseFloat(cur);
    if (isNaN(a) || isNaN(b)) return cur;
    let r;
    if (op === "+") r = a + b;
    else if (op === "−") r = a - b;
    else if (op === "×") r = a * b;
    else if (op === "÷") r = b === 0 ? NaN : a / b;
    else return cur;
    if (!isFinite(r)) return "Error";
    return String(Math.round(r * 1e10) / 1e10);
  };

  const press = k => {
    if (/[0-9]/.test(k)) { cur = fresh || cur === "0" ? k : cur + k; fresh = false; }
    else if (k === ".") { if (fresh) { cur = "0."; fresh = false; } else if (!cur.includes(".")) cur += "."; }
    else if (k === "C") { cur = "0"; prev = null; op = null; fresh = true; }
    else if (k === "±") cur = cur.startsWith("-") ? cur.slice(1) : (cur === "0" ? cur : "-" + cur);
    else if (k === "%") { cur = String(parseFloat(cur) / 100); fresh = true; }
    else if (["+", "−", "×", "÷"].includes(k)) {
      if (op && !fresh) { cur = calc(); }
      prev = cur; op = k; fresh = true;
    } else if (k === "=") {
      if (op && prev !== null) { cur = calc(); prev = null; op = null; fresh = true; }
    }
    show();
  };

  $$(".ckey", win).forEach(b => b.addEventListener("click", () => press(b.dataset.k)));

  const keyMap = { "*": "×", "/": "÷", "-": "−", Enter: "=", "=": "=", Escape: "C", c: "C", "%": "%" };
  const onKey = e => {
    if (!win.classList.contains("active")) return;
    const k = keyMap[e.key] || (/^[0-9.+]$/.test(e.key) ? e.key : null);
    if (!k) { if (e.key === "Backspace") { cur = cur.length > 1 ? cur.slice(0, -1) : "0"; show(); } return; }
    e.preventDefault();
    press(k);
    const btn = $('[data-k="' + k + '"]', win);
    if (btn && !reduced()) btn.animate([{ transform: "scale(1)" }, { transform: "scale(.92)" }, { transform: "scale(1)" }], { duration: 140 });
  };

  window.addEventListener("keydown", onKey);
  win._cleanup = () => window.removeEventListener("keydown", onKey);
  show();
}

/* ============================================================
   MINESWEEPER
   ============================================================ */
function mountMines(win) {
  const SIZE = 9, MINES = 10;
  const grid = $("#msGrid", win);
  const flagEl = $("#msFlags", win), timeEl = $("#msTime", win), msg = $("#msMsg", win);
  let board, over, started, flags, timer, secs;

  grid.style.gridTemplateColumns = "repeat(" + SIZE + ", 28px)";

  const idx = (r, c) => r * SIZE + c;
  const near = (r, c) => {
    const out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) out.push(idx(nr, nc));
    }
    return out;
  };

  const build = () => {
    board = Array.from({ length: SIZE * SIZE }, () => ({ mine: false, open: false, flag: false, n: 0 }));
    over = false; started = false; flags = MINES; secs = 0;
    clearInterval(timer);
    timeEl.textContent = "000";
    flagEl.textContent = String(MINES);
    msg.textContent = "Left click reveals · right click flags";
    grid.innerHTML = board.map((_, i) => '<button class="cell" data-i="' + i + '"></button>').join("");
    $$(".cell", grid).forEach(b => {
      b.addEventListener("click", () => reveal(+b.dataset.i));
      b.addEventListener("contextmenu", e => { e.preventDefault(); flag(+b.dataset.i); });
      let lp;
      b.addEventListener("touchstart", () => { lp = setTimeout(() => flag(+b.dataset.i), 420); }, { passive: true });
      b.addEventListener("touchend", () => clearTimeout(lp));
      b.addEventListener("touchmove", () => clearTimeout(lp));
    });
  };

  const seed = safe => {
    const banned = new Set([safe, ...near(Math.floor(safe / SIZE), safe % SIZE)]);
    let placed = 0;
    while (placed < MINES) {
      const i = Math.floor(Math.random() * board.length);
      if (board[i].mine || banned.has(i)) continue;
      board[i].mine = true; placed++;
    }
    board.forEach((c, i) => {
      c.n = near(Math.floor(i / SIZE), i % SIZE).filter(j => board[j].mine).length;
    });
    started = true;
    timer = setInterval(() => {
      secs = Math.min(999, secs + 1);
      timeEl.textContent = String(secs).padStart(3, "0");
    }, 1000);
  };

  const paint = i => {
    const c = board[i], el = $('[data-i="' + i + '"]', grid);
    el.className = "cell" + (c.open ? " open" : "") + (c.flag ? " flag" : "") + (c.open && c.n && !c.mine ? " n" + c.n : "");
    if (c.open && c.mine) { el.classList.add("mine"); el.textContent = "✳"; }
    else if (c.open) el.textContent = c.n ? String(c.n) : "";
    else el.textContent = c.flag ? "⚑" : "";
  };

  const flag = i => {
    if (over || board[i].open) return;
    board[i].flag = !board[i].flag;
    flags += board[i].flag ? -1 : 1;
    flagEl.textContent = String(flags);
    paint(i);
  };

  const reveal = i => {
    if (over || board[i].flag || board[i].open) return;
    if (!started) seed(i);
    const c = board[i];
    if (c.mine) { finish(false); return; }
    const stack = [i];
    while (stack.length) {
      const k = stack.pop();
      const cell = board[k];
      if (cell.open || cell.flag) continue;
      cell.open = true;
      paint(k);
      if (cell.n === 0) near(Math.floor(k / SIZE), k % SIZE).forEach(j => { if (!board[j].open) stack.push(j); });
    }
    if (board.filter(x => !x.mine).every(x => x.open)) finish(true);
  };

  const finish = won => {
    over = true;
    clearInterval(timer);
    board.forEach((c, i) => { if (c.mine) { c.open = true; paint(i); } });
    msg.textContent = won ? "Cleared in " + secs + "s — nicely done" : "Detonated. Try again.";
    if (won) toast("Minefield cleared in " + secs + "s", "check");
  };

  $("#msNew", win).addEventListener("click", build);
  win._cleanup = () => clearInterval(timer);
  build();
}

/* ============================================================
   POMODORO TIMER
   ============================================================ */
function mountTimer(win) {
  const MODES = [
    { label: "Focus", mins: 25, color: "var(--accent)" },
    { label: "Short break", mins: 5, color: "var(--ok)" },
    { label: "Long break", mins: 15, color: "var(--warn)" }
  ];

  const CIRCUMFERENCE = 2 * Math.PI * 90; // r=90
  let mode = 0, secs = 0, total = 0, running = false, interval = null;
  let sessions = 0;

  const ring = $("#timerRing", win);
  const display = $("#timerDisplay", win);
  const label = $("#timerLabel", win);
  const toggleBtn = $("#timerToggle", win);
  const dots = $$(".timer-dot", win);

  function setMode(m) {
    mode = m;
    $$(".timer-mode", win).forEach((b, i) => b.classList.toggle("on", i === m));
    total = MODES[m].mins * 60;
    secs = total;
    ring.style.stroke = MODES[m].color;
    label.textContent = MODES[m].label;
    pause();
    draw();
  }

  function draw() {
    const m = Math.floor(secs / 60), s = secs % 60;
    display.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    const pct = total > 0 ? (total - secs) / total : 0;
    ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - pct);
    ring.style.strokeDasharray = CIRCUMFERENCE;
  }

  function tick() {
    if (secs <= 0) {
      pause();
      toast(MODES[mode].label + " complete!", "check");
      if (mode === 0) {
        sessions = Math.min(4, sessions + 1);
        dots.forEach((d, i) => d.classList.toggle("done", i < sessions));
        if (sessions >= 4) { sessions = 0; dots.forEach(d => d.classList.remove("done")); toast("4 sessions done — take a long break", "award"); }
      }
      return;
    }
    secs--;
    draw();
  }

  function play() {
    if (running) return;
    running = true;
    interval = setInterval(tick, 1000);
    toggleBtn.innerHTML = svg("pause", 22);
  }

  function pause() {
    running = false;
    clearInterval(interval);
    toggleBtn.innerHTML = svg("play", 22);
  }

  toggleBtn.addEventListener("click", () => running ? pause() : play());
  $("#timerReset", win).addEventListener("click", () => { pause(); secs = total; draw(); });
  $("#timerSkip", win).addEventListener("click", () => { pause(); setMode((mode + 1) % MODES.length); });
  $$(".timer-mode", win).forEach((b, i) => b.addEventListener("click", () => setMode(i)));

  win._cleanup = () => clearInterval(interval);
  setMode(0);
}

  ].map(s => `

      <small>${s.label}</small>

    const wrap = $("#sysmonGraphWrap", win);

    const W = wrap.clientWidth, H = 60;

    canvas.style.width = W + "px"; canvas.style.height = H + "px";

    ctx.scale(dpr, dpr);

      const x = (i / (cpuHistory.length - 1)) * W;
      const y = H - (v / 100) * H;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.lineTo(W, H); ctx.lineTo(0, H);

  graphInterval = setInterval(() => {

  }, 1200);

  // tabs
  $$(".sysmon-tab", win).forEach(t => t.addEventListener("click", () => {

  }));

  setTimeout(drawGraph, 80);
  win._cleanup = () => clearInterval(graphInterval);
}

/* ============================================================
   FOCUS MUSIC (Web Audio API — no external deps)
   ============================================================ */
function mountMusic(win) {
  let ctx = null, masterGain = null, activeNodes = [], playing = false, activeScene = null;
  let visInterval = null;
  const bars = Array.from({ length: 8 }, (_, i) => win.querySelector("#mbar" + i));

  const SCENES = {
    focus: {
      name: "Deep Focus",
      emoji: "🧠",
      desc: "Binaural tones · 40 Hz gamma carrier",
      build(ac, master) {
        const osc1 = ac.createOscillator(), osc2 = ac.createOscillator();
        osc1.type = "sine"; osc2.type = "sine";
        osc1.frequency.value = 200; osc2.frequency.value = 240; // 40Hz binaural beat
        const g = ac.createGain(); g.gain.value = 0.12;
        const merger = ac.createChannelMerger(2);
        const g1 = ac.createGain(); g1.gain.value = 1;
        const g2 = ac.createGain(); g2.gain.value = 1;
        osc1.connect(g1); g1.connect(merger, 0, 0);
        osc2.connect(g2); g2.connect(merger, 0, 1);
        merger.connect(g); g.connect(master);
        osc1.start(); osc2.start();
        return [osc1, osc2, g, g1, g2, merger];
      }
    },
    rain: {
      name: "Rain",
      emoji: "🌧️",
      desc: "Brown noise · steady rainfall",
      build(ac, master) {
        const bufLen = ac.sampleRate * 4;
        const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
        const d = buf.getChannelData(0);
        let last = 0;
        for (let i = 0; i < bufLen; i++) { last = (Math.random() * 2 - 1 + last * 6) / 7; d[i] = last * 3.5; }
        const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        const filter = ac.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 800;
        const g = ac.createGain(); g.gain.value = 0.35;
        src.connect(filter); filter.connect(g); g.connect(master); src.start();
        return [src, filter, g];
      }
    },
    forest: {
      name: "Forest",
      emoji: "🌲",
      desc: "Wind noise · light breeze",
      build(ac, master) {
        const bufLen = ac.sampleRate * 3;
        const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bufLen; i++) d[i] = (Math.random() * 2 - 1) * 0.8;
        const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
        const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 300;
        const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
        const lfo = ac.createOscillator(); lfo.frequency.value = 0.12; lfo.type = "sine";
        const lfoGain = ac.createGain(); lfoGain.gain.value = 0.08;
        const g = ac.createGain(); g.gain.value = 0.22;
        src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(master);
        lfo.connect(lfoGain); lfoGain.connect(g.gain);
        src.start(); lfo.start();
        return [src, hp, lp, lfo, lfoGain, g];
      }
    },
    cosmos: {
      name: "Cosmos",
      emoji: "🌌",
      desc: "Slow drifting pads · deep space",
      build(ac, master) {
        const nodes = [];
        const freqs = [55, 82.5, 110, 165];
        freqs.forEach(f => {
          const osc = ac.createOscillator(); osc.type = "sine"; osc.frequency.value = f;
          const g = ac.createGain(); g.gain.value = 0.06;
          const lfo = ac.createOscillator(); lfo.frequency.value = 0.05 + Math.random() * 0.1;
          const lfog = ac.createGain(); lfog.gain.value = 0.03;
          osc.connect(g); g.connect(master);
          lfo.connect(lfog); lfog.connect(g.gain);
          osc.start(); lfo.start();
          nodes.push(osc, g, lfo, lfog);
        });
        return nodes;
      }
    }
  };

  function stopAll() {
    activeNodes.forEach(n => { try { n.stop && n.stop(); n.disconnect && n.disconnect(); } catch (e) {} });
    activeNodes = [];
  }

  function startScene(id) {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = parseFloat($("#musicVolume", win).value) / 100;
      masterGain.connect(ctx.destination);
    }
    if (ctx.state === "suspended") ctx.resume();
    stopAll();
    const scene = SCENES[id];
    activeNodes = scene.build(ctx, masterGain);
    activeScene = id;
    playing = true;
    $("#musicTitle", win).textContent = scene.name;
    $("#musicSub", win).textContent = scene.desc;
    $("#musicArt", win).textContent = scene.emoji;
    $("#musicPlay", win).innerHTML = svg("pause", 20);
    $$(".music-scene", win).forEach(b => b.classList.toggle("on", b.dataset.scene === id));
    startVis();
  }

  function stopScene() {
    stopAll();
    playing = false;
    clearInterval(visInterval);
    bars.forEach(b => { if (b) b.style.height = "4px"; });
    $("#musicPlay", win).innerHTML = svg("play", 20);
  }

  function startVis() {
    clearInterval(visInterval);
    const heights = [4, 8, 14, 10, 18, 12, 7, 15];
    visInterval = setInterval(() => {
      if (!playing) return;
      bars.forEach((b, i) => {
        if (!b) return;
        const h = Math.max(4, heights[i] + (Math.random() - 0.5) * 12);
        heights[i] = Math.max(4, Math.min(26, h));
        b.style.height = heights[i] + "px";
      });
    }, 120);
  }

  $$(".music-scene", win).forEach(b => b.addEventListener("click", () => {
    if (activeScene === b.dataset.scene && playing) { stopScene(); return; }
    startScene(b.dataset.scene);
  }));

  $("#musicPlay", win).addEventListener("click", () => {
    if (playing) stopScene();
    else if (activeScene) startScene(activeScene);
    else toast("Select a soundscape first", "music");
  });

  $("#musicVolume", win).addEventListener("input", e => {
    if (masterGain) masterGain.gain.value = parseFloat(e.target.value) / 100;
  });

  win._cleanup = () => {
    stopScene();
    if (ctx) ctx.close();
  };
}

/* ============================================================
   GITHUB STATS
   ============================================================ */
async function mountGithub(win) {
  const HANDLE = PROFILE.links.github.split("/").pop();
  const content = $("#ghContent", win);

  const LANG_COLORS = {
    JavaScript: "#f7df1e", TypeScript: "#3178c6", Python: "#3572a5",
    CSS: "#563d7c", HTML: "#e34c26", "C++": "#f34b7d", Shell: "#89e051",
    Dockerfile: "#384d54", SCSS: "#c6538c", MDX: "#fcb32c", default: "#8b949e"
  };

  try {
    const [user, repos] = await Promise.all([
      fetch("https://api.github.com/users/" + HANDLE).then(r => r.json()),
      fetch("https://api.github.com/users/" + HANDLE + "/repos?sort=pushed&per_page=12").then(r => r.json())
    ]);

    if (user.message === "Not Found") throw new Error("User not found");

    // count languages
    const langCount = {};
    repos.forEach(r => { if (r.language) langCount[r.language] = (langCount[r.language] || 0) + 1; });
    const total = Object.values(langCount).reduce((a, b) => a + b, 0) || 1;
    const topLangs = Object.entries(langCount).sort((a, b) => b[1] - a[1]).slice(0, 6);

    content.parentElement.innerHTML = `
      <div class="gh-profile">
        <div class="gh-ava"><img src="${esc(user.avatar_url)}" alt="${esc(user.login)}" loading="lazy" /></div>
        <div class="gh-meta">
          <div class="gh-login">${esc(user.name || user.login)}</div>
          <div class="gh-bio">${esc(user.bio || "Full-Stack Developer · Blue Team practitioner")}</div>
          <div class="gh-nums">
            <span class="gh-num"><b>${user.public_repos}</b> repos</span>
            <span class="gh-num"><b>${user.followers}</b> followers</span>
            <span class="gh-num"><b>${user.following}</b> following</span>
            ${user.location ? '<span class="gh-num">📍 ' + esc(user.location) + "</span>" : ""}
          </div>
        </div>
        <a class="btn ghost sm" href="${esc(user.html_url)}" target="_blank" rel="noreferrer" style="align-self:flex-start">
          ${svg("external", 14)} Open profile
        </a>
      </div>

      <div class="gh-section">
        <div class="gh-section-title">Languages</div>
        <div class="gh-langs" id="ghLangs">
          ${topLangs.map(([lang, count]) => `
            <div class="gh-lang-row">
              <span class="gh-lang-label">${esc(lang)}</span>
              <div class="gh-lang-bar">
                <i id="ghl-${esc(lang.replace(/\s+/g, "-"))}" style="background:${LANG_COLORS[lang] || LANG_COLORS.default};width:0%"></i>
              </div>
              <span class="gh-lang-pct">${Math.round((count / total) * 100)}%</span>
            </div>`).join("")}
        </div>
      </div>

      <div class="gh-section">
        <div class="gh-section-title">Recent repositories</div>
        <div class="gh-repos">
          ${repos.slice(0, 8).map(r => `
            <a class="gh-repo" href="${esc(r.html_url)}" target="_blank" rel="noreferrer" style="text-decoration:none">
              <div class="gh-repo-name">${esc(r.name)}</div>
              <div class="gh-repo-desc">${esc(r.description || "No description.")}</div>
              <div class="gh-repo-foot">
                ${r.language ? `<div class="gh-repo-lang"><span class="gh-repo-lang-dot" style="background:${LANG_COLORS[r.language] || LANG_COLORS.default}"></span>${esc(r.language)}</div>` : ""}
                <span class="gh-repo-stars">⭐ ${r.stargazers_count}</span>
              </div>
            </a>`).join("")}
        </div>
      </div>`;

    // animate language bars
    setTimeout(() => {
      topLangs.forEach(([lang, count]) => {
        const el = win.querySelector("#ghl-" + lang.replace(/\s+/g, "-"));
        if (el) el.style.width = Math.round((count / total) * 100) + "%";
      });
    }, 60);

  } catch (err) {
    content.innerHTML = `<div class="gh-error">${svg("github", 22)}<br><br>Could not load GitHub data.<br><small>Check your connection or the username in PROFILE.</small></div>`;
  }
}

/* ---------- start menu ---------- */
function renderStart() {

      t.style.display = hit ? "" : "none";

    });

}

function doPower(kind) {
  closePanels();
  if (kind === "lock") { lockSession(false); return; }
  if (kind === "signout") { lockSession(true); return; }
  if (kind === "restart") {
    lockSession(true);
    setTimeout(() => { startSignIn(); setTimeout(runBoot, 260); }, 380);
  }
}

}

/* ---------- command palette ---------- */
let palItems = [];
let palIdx = 0;

function buildPaletteSource() {
  const src = [];
  Object.keys(APPS).forEach(id => src.push({
    group: "Applications", icon: APPS[id].icon, label: "Open " + APPS[id].title,
    hint: "app", run: () => openApp(id)
  }));
  PROFILE.projects.forEach(p => src.push({
    group: "Projects", icon: "external", label: p.name, hint: p.year,
    run: () => window.open(p.url, "_blank", "noreferrer")
  }));
  src.push(
    { group: "System", icon: "grid", label: "Show task view", hint: "F2", run: () => toggleTaskView(true) },
    { group: "System", icon: "layers", label: "Toggle appearance (light / dark)", hint: "theme", run: () => { SHELL.theme = SHELL.theme === "dark" ? "light" : "dark"; store.set("theme", SHELL.theme); applyTheme(); toast("Appearance: " + SHELL.theme); } },
    { group: "System", icon: "spark", label: "Cycle accent colour", hint: "accent", run: () => { const i = ACCENTS.findIndex(a => a.id === SHELL.accent); const n = ACCENTS[(i + 1) % ACCENTS.length]; SHELL.accent = n.id; store.set("accent", n.id); applyAccent(); toast("Accent: " + n.label); } },
    { group: "System", icon: "globe", label: "Cycle wallpaper", hint: "wallpaper", run: () => { const i = WALLS.findIndex(w => w.id === SHELL.wall); const n = WALLS[(i + 1) % WALLS.length]; SHELL.wall = n.id; store.set("wall", n.id); applyWall(); toast("Wallpaper: " + n.label); } },
    { group: "System", icon: "refresh", label: "Cycle open windows", hint: "focus", run: cycleWindows },
    { group: "System", icon: "close", label: "Close all windows", hint: "", run: () => closeAllWindows() },
    { group: "System", icon: "lock", label: "Lock session", hint: "", run: () => doPower("lock") },
    { group: "Links", icon: "github", label: "GitHub profile", hint: "external", run: () => window.open(PROFILE.links.github, "_blank", "noreferrer") },
    { group: "Links", icon: "linkedin", label: "LinkedIn profile", hint: "external", run: () => window.open(PROFILE.links.linkedin, "_blank", "noreferrer") },
    { group: "Links", icon: "mail", label: "Send an email", hint: PROFILE.email, run: () => { window.location.href = "mailto:" + PROFILE.email; } }
  );
  return src;
}

let PAL_SRC = [];

function drawPalette(q) {
  const list = $("#palList");
  const needle = q.trim().toLowerCase();
  const hits = needle
    ? PAL_SRC.filter(i => (i.label + " " + i.group + " " + i.hint).toLowerCase().includes(needle))
    : PAL_SRC;

  palItems = hits.slice(0, 40);
  palIdx = 0;

  if (!palItems.length) {
    list.innerHTML = '<div class="sm-empty">No matches. Try “projects”, “theme”, or an app name.</div>';
    return;
  }

  let html = "", lastGroup = null;
  palItems.forEach((it, i) => {
    if (it.group !== lastGroup) { html += '<div class="pal-group">' + esc(it.group) + "</div>"; lastGroup = it.group; }
    html += '<button class="pal-item' + (i === 0 ? " cur" : "") + '" data-i="' + i + '">' +
      svg(it.icon, 17) + "<span>" + esc(it.label) + "</span>" +
      (it.hint ? "<small>" + esc(it.hint) + "</small>" : "") + "</button>";
  });
  list.innerHTML = html;

  $$(".pal-item", list).forEach(b => {
    b.addEventListener("mouseenter", () => setPalIdx(+b.dataset.i));
    b.addEventListener("click", () => runPal(+b.dataset.i));
  });
}

function setPalIdx(i) {
  palIdx = Math.max(0, Math.min(palItems.length - 1, i));
  $$(".pal-item").forEach(b => b.classList.toggle("cur", +b.dataset.i === palIdx));
  const cur = $('.pal-item[data-i="' + palIdx + '"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function runPal(i) {
  const it = palItems[i];
  if (!it) return;
  closePalette();
  setTimeout(() => it.run(), 90);
}

function openPalette() {
  PAL_SRC = buildPaletteSource();
  closePanels();
  const p = $("#palette");
  p.classList.add("open");
  const inp = $("#palInput");
  inp.value = "";
  drawPalette("");
  setTimeout(() => inp.focus(), 60);
}

function closePalette() { $("#palette").classList.remove("open"); }

/* ---------- task view ---------- */
function refreshTaskView() {
  const g = $("#tvGrid");
  if (!g) return;
  const ids = Array.from(wins.keys());
  if (!ids.length) {
    g.innerHTML = '<div class="tv-empty">Nothing is open. Press <kbd>Ctrl</kbd> <kbd>K</kbd> or pick an icon to start.</div>';
    return;
  }
  g.innerHTML = ids.map((id, i) => {
    const a = APPS[id];
    return '<button class="tv-card" data-app="' + id + '" style="animation-delay:' + i * 45 + 'ms">' +
      '<div class="tv-head">' + svg(a.icon, 15) + "<span>" + esc(a.title) + "</span></div>" +
      '<div class="tv-body">' + esc(a.title) + " window · " + (wins.get(id).classList.contains("min") ? "minimised" : "open") + "</div>" +
      "</button>";
  }).join("");

function toggleTaskView(force) {
  const tv = $("#taskView");

  tv.classList.toggle("open", next);

/* ---------- context menu ---------- */
function openCtx(x, y) {
  const m = $("#ctxMenu");
  m.innerHTML = [
    { i: "grid", l: "Task view", a: () => toggleTaskView(true) },
    { i: "command", l: "Command palette", a: openPalette },

    { i: "globe", l: "Next wallpaper", a: () => { const idx = WALLS.findIndex(w => w.id === SHELL.wall); const n = WALLS[(idx + 1) % WALLS.length]; SHELL.wall = n.id; store.set("wall", n.id); applyWall(); toast("Wallpaper: " + n.label); } },
    { i: "layers", l: "Toggle appearance", a: () => { SHELL.theme = SHELL.theme === "dark" ? "light" : "dark"; store.set("theme", SHELL.theme); applyTheme(); } },
    { sep: true },
    { i: "sliders", l: "Personalise", a: () => openApp("settings") }
  ].map((it, i) => it.sep ? '<div class="ctx-sep"></div>'
    : '<button class="ctx-item" data-c="' + i + '">' + svg(it.i, 15) + "<span>" + it.l + "</span></button>").join("");

  const acts = [
    () => toggleTaskView(true),
    openPalette,
    null,
    () => { const idx = WALLS.findIndex(w => w.id === SHELL.wall); const n = WALLS[(idx + 1) % WALLS.length]; SHELL.wall = n.id; store.set("wall", n.id); applyWall(); toast("Wallpaper: " + n.label); },
    () => { SHELL.theme = SHELL.theme === "dark" ? "light" : "dark"; store.set("theme", SHELL.theme); applyTheme(); },

  ];

    const f = acts[+b.dataset.c];
    if (f) f();
  }));

  m.style.left = Math.min(x, window.innerWidth - 220) + "px";
  m.style.top = Math.min(y, window.innerHeight - 260) + "px";
  m.classList.add("open");
}

/* ---------- global wiring ---------- */
function wireShell() {
  $("#startBtn").addEventListener("click", e => { e.stopPropagation(); togglePanel($("#startMenu")); setTimeout(() => $("#smSearch").focus(), 180); });
  $("#widgetBtn").addEventListener("click", e => { e.stopPropagation(); openWidgets("left"); });
  $("#searchBtn").addEventListener("click", e => { e.stopPropagation(); openPalette(); });
  $("#taskViewBtn").addEventListener("click", e => { e.stopPropagation(); toggleTaskView(); });
  $("#trayClock").addEventListener("click", e => { e.stopPropagation(); openWidgets("right"); });

  $("#palInput").addEventListener("input", e => drawPalette(e.target.value));
  $("#palInput").addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); setPalIdx(palIdx + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setPalIdx(palIdx - 1); }
    else if (e.key === "Enter") { e.preventDefault(); runPal(palIdx); }
  });
  $("#palette").addEventListener("pointerdown", e => { if (e.target.id === "palette") closePalette(); });
  $("#taskView").addEventListener("pointerdown", e => { if (e.target.id === "taskView") toggleTaskView(false); });

  document.addEventListener("pointerdown", e => {
    if (e.target.closest(".panel") || e.target.closest(".taskbar") || e.target.closest("#ctxMenu")) return;
    closePanels();
  });

  $("#desktop").addEventListener("contextmenu", e => {
    if (e.target.closest(".win") || e.target.closest(".taskbar") || e.target.closest(".panel")) return;
    e.preventDefault();
    openCtx(e.clientX, e.clientY);
  });

  // buttons inside app windows that open other apps
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-open]");
    if (b) openApp(b.dataset.open, b);
  });

  window.addEventListener("keydown", e => {
    if ($("#stage").style.display !== "none") return;   // session locked
    const mod = e.ctrlKey || e.metaKey;
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);

    if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
    if (e.key === "F2") { e.preventDefault(); toggleTaskView(); return; }

    if (e.key === "Escape") {
      if ($("#palette").classList.contains("open")) { closePalette(); return; }
      if ($("#taskView").classList.contains("open")) { toggleTaskView(false); return; }
      if ($$(".panel.open").length || $("#ctxMenu").classList.contains("open")) { closePanels(); return; }
      return;
    }

    if (mod && e.key.toLowerCase() === "w" && activeId) { e.preventDefault(); closeWindow(activeId); return; }
    if (!typing && e.key === "`" && e.altKey) { e.preventDefault(); cycleWindows(); }
  });

  // keep windows inside the viewport on resize
  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const b = layerBox();
      wins.forEach(w => {
        if (w.classList.contains("max")) { w.style.width = b.w + "px"; w.style.height = b.h + "px"; return; }
        if (isMobile()) return;
        const l = parseFloat(w.style.left) || 0, t = parseFloat(w.style.top) || 0;
        w.style.left = Math.max(0, Math.min(l, b.w - 120)) + "px";
        w.style.top = Math.max(0, Math.min(t, b.h - 48)) + "px";
        if (w.offsetWidth > b.w) w.style.width = (b.w - 20) + "px";
        if (w.offsetHeight > b.h) w.style.height = (b.h - 20) + "px";
      });
    }, 140);
  });
}

/* ---------- lock / login wiring ---------- */
function wireStage() {
  const stage = $("#stage");
  $("#loginName").textContent = PROFILE.name;
  $("#loginRole").textContent = PROFILE.role;
  $("#loginAva").textContent = initials(PROFILE.name);
  $("#brandName").textContent = PROFILE.osName;

  stage.addEventListener("click", e => {
    if (stage.classList.contains("signing") || stage.classList.contains("booting")) return;
    startSignIn();
  });

  window.addEventListener("keydown", e => {
    if (stage.style.display === "none") return;
    if (stage.classList.contains("booting")) return;
    if (!stage.classList.contains("signing") && e.key !== "Tab") { startSignIn(); return; }
    if (e.key === "Enter") runBoot();
  });

  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add("lit")));

  $("#pwGo").addEventListener("click", e => { e.stopPropagation(); runBoot(); });
  $("#guestBtn").addEventListener("click", e => { e.stopPropagation(); runBoot(); });
  $("#pwInput").addEventListener("click", e => e.stopPropagation());
}

/* ---------- boot ---------- */
function init() {
  applyAll();
  hydrateIcons(document);
  renderDesktop();
  renderStart();
  renderWidgets();
  wireStage();
  wireShell();
  refreshTaskView();
  tickClocks();
  setInterval(tickClocks, 1000);

  if (navigator.platform && /Mac/.test(navigator.platform)) {
    const k = $("#hintKey");
    if (k) k.textContent = "⌘";
  }
}

document.addEventListener("DOMContentLoaded", init);

  </script>
